<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iSTAT ABG Master Analyzer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-primary: #0d1117;
            --bg-secondary: #1c2128;
            --bg-tertiary: #262c36;
            --text-primary: #e6edf3;
            --text-secondary: #8b949e;
            --border: #30363d;
            --accent-normal: #58a6ff;
            --accent-warning: #d29922;
            --accent-critical: #f85149;
            --accent-safe: #3fb950;
            --font-display: 'Monaco', 'Courier New', monospace;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg-primary); color: var(--text-primary); padding: 20px; line-height: 1.6; }
        .container { max-width: 1200px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 30px; padding: 20px; border-bottom: 2px solid var(--border); }
        .header h1 { font-size: 1.8rem; margin-bottom: 8px; color: var(--accent-normal); }
        .header p { color: var(--text-secondary); font-size: 0.9rem; }
        .case-selector { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 24px; padding: 20px; background: var(--bg-secondary); border-radius: 8px; }
        .case-btn { padding: 12px 16px; background: var(--bg-tertiary); color: var(--text-primary); border: 2px solid var(--border); border-radius: 6px; cursor: pointer; font-size: 0.9rem; transition: all 0.2s; text-align: left; }
        .case-btn:hover { border-color: var(--accent-normal); background: var(--bg-primary); }
        .case-btn.active { border-color: var(--accent-normal); background: rgba(88, 166, 255, 0.1); }
        .case-name { font-weight: 600; margin-bottom: 4px; }
        .case-desc { font-size: 0.8rem; color: var(--text-secondary); }
        .input-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 24px; padding: 20px; background: var(--bg-secondary); border-radius: 8px; }
        .input-group { display: flex; flex-direction: column; }
        .input-group label { font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 4px; font-weight: 500; }
        .input-group input { padding: 8px 12px; background: var(--bg-tertiary); border: 1px solid var(--border); color: var(--text-primary); border-radius: 4px; font-family: var(--font-display); }
        .input-group input:focus { outline: none; border-color: var(--accent-normal); box-shadow: 0 0 0 2px rgba(88, 166, 255, 0.1); }
        .button-group { display: flex; gap: 12px; margin-bottom: 24px; }
        .btn-analyze { flex: 1; padding: 12px 24px; background: var(--accent-normal); color: var(--bg-primary); border: none; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 1rem; }
        .btn-analyze:hover { background: #4184e4; }
        .tabs { display: flex; gap: 12px; margin-bottom: 24px; border-bottom: 2px solid var(--border); flex-wrap: wrap; }
        .tab-btn { padding: 12px 20px; background: none; border: none; color: var(--text-secondary); cursor: pointer; font-size: 0.95rem; border-bottom: 3px solid transparent; transition: all 0.2s; margin-bottom: -2px; }
        .tab-btn:hover { color: var(--text-primary); }
        .tab-btn.active { color: var(--accent-normal); border-bottom-color: var(--accent-normal); }
        .tab-content { display: none; padding: 20px; background: var(--bg-secondary); border-radius: 8px; }
        .tab-content.active { display: block; }
        .analysis-section { padding: 16px; background: var(--bg-tertiary); border-left: 4px solid var(--accent-normal); border-radius: 6px; margin-bottom: 20px; }
        .section-title { font-weight: 600; font-size: 1rem; margin-bottom: 16px; color: var(--accent-normal); font-family: var(--font-display); }
        .flowchart-row { display: grid; grid-template-columns: 200px 30px 1fr; align-items: center; gap: 12px; margin-bottom: 12px; }
        .flowchart-box { padding: 12px; background: var(--bg-secondary); border: 2px solid var(--border); border-radius: 6px; text-align: center; font-weight: 500; font-size: 0.9rem; }
        .flowchart-arrow { text-align: center; color: var(--text-secondary); font-size: 1.2rem; }
        .interpretation { padding: 12px; background: rgba(94, 234, 212, 0.05); border-radius: 4px; border-left: 3px solid var(--accent-safe); font-size: 0.9rem; }
        .slider-group { margin: 20px 0; padding: 16px; background: var(--bg-primary); border-radius: 6px; border: 1px solid var(--border); }
        .slider-label { display: flex; justify-content: space-between; font-size: 0.9rem; margin-bottom: 8px; font-weight: 500; }
        .slider-label-value { color: var(--accent-normal); font-family: var(--font-display); }
        input[type="range"] { width: 100%; height: 6px; border-radius: 3px; background: var(--border); outline: none; -webkit-appearance: none; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 18px; height: 18px; border-radius: 50%; background: var(--accent-normal); cursor: pointer; }
        input[type="range"]::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: var(--accent-normal); cursor: pointer; border: none; }
        .perturbation-summary { padding: 16px; background: rgba(94, 234, 212, 0.05); border-left: 3px solid var(--accent-safe); border-radius: 4px; margin-top: 16px; font-size: 0.9rem; line-height: 1.7; }
        .disclaimer { padding: 12px; background: rgba(210, 153, 34, 0.1); border-left: 3px solid var(--accent-warning); margin-bottom: 20px; border-radius: 4px; font-size: 0.85rem; color: var(--text-secondary); }
    </style>
</head>
<body>
<div class="container">
    <div class="disclaimer">
        <strong>⚠️ DISCLAIMER:</strong> Educational tool only. Always correlate with clinical context and verify calculations using current institutional protocols.
    </div>

    <div class="header">
        <h1>iSTAT CG8+ ABG Master Analyzer</h1>
        <p>Hughes & Brain | Stewart | Traditional Boston | Figge-Fencl</p>
    </div>

    <div class="case-selector" id="caseOptions">
        <h3 style="grid-column: 1/-1; margin-bottom: 12px; color: var(--text-secondary);">SELECT A TEST CASE</h3>
    </div>

    <div class="input-grid">
        <div class="input-group"><label>pH</label><input type="number" id="pH" step="0.01" min="6" max="8" placeholder="7.35"></div>
        <div class="input-group"><label>pCO2 (mmHg)</label><input type="number" id="pCO2" step="1" min="10" max="100" placeholder="40"></div>
        <div class="input-group"><label>pO2 (mmHg)</label><input type="number" id="pO2" step="1" min="20" max="200" placeholder="90"></div>
        <div class="input-group"><label>HCO3 (mmol/L)</label><input type="number" id="HCO3" step="0.1" min="1" max="60" placeholder="24"></div>
        <div class="input-group"><label>Na (mmol/L)</label><input type="number" id="Na" step="1" min="110" max="160" placeholder="140"></div>
        <div class="input-group"><label>K (mmol/L)</label><input type="number" id="K" step="0.1" min="2" max="8" placeholder="4.0"></div>
        <div class="input-group"><label>Cl (mmol/L)</label><input type="number" id="Cl" step="1" min="80" max="120" placeholder="105"></div>
        <div class="input-group"><label>iCa (mmol/L)</label><input type="number" id="iCa" step="0.01" min="0.5" max="2" placeholder="1.20"></div>
        <div class="input-group"><label>Lactate (mmol/L)</label><input type="number" id="Lactate" step="0.1" min="0" max="20" placeholder="1.5"></div>
        <div class="input-group"><label>Albumin (g/L)</label><input type="number" id="Albumin" step="1" min="20" max="60" placeholder="40"></div>
        <div class="input-group"><label>PO4 (mmol/L)</label><input type="number" id="PO4" step="0.1" min="0.5" max="2.5" placeholder="1.0"></div>
        <div class="input-group"><label>Glucose (mmol/L)</label><input type="number" id="Glucose" step="0.1" min="1" max="40" placeholder="5.0"></div>
        <div class="input-group"><label>Hb (g/L)</label><input type="number" id="Hb" step="5" min="60" max="200" placeholder="140"></div>
        <div class="input-group"><label>Creatinine (μmol/L)</label><input type="number" id="Crea" step="5" min="30" max="300" placeholder="90"></div>
    </div>

    <div class="button-group">
        <button class="btn-analyze" onclick="analyzeCase()">ANALYZE</button>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('hughes')">Hughes & Brain</button>
        <button class="tab-btn" onclick="switchTab('stewart')">Stewart</button>
        <button class="tab-btn" onclick="switchTab('traditional')">Traditional</button>
        <button class="tab-btn" onclick="switchTab('figge')">Figge-Fencl</button>
    </div>

    <div id="hughes" class="tab-content active"><div id="hughesOutput"></div></div>
    <div id="stewart" class="tab-content"><div id="stewartOutput"></div></div>
    <div id="traditional" class="tab-content"><div id="traditionalOutput"></div></div>
    <div id="figge" class="tab-content"><div id="figgeOutput"></div></div>
</div>

<script>
const cases = [
    { name: "Septic Shock", description: "High lactate, low albumin, AKI, K+", data: { pH: 7.28, pCO2: 31, pO2: 87, HCO3: 16, Na: 128, K: 5.8, Cl: 102, iCa: 0.92, Lactate: 8.5, Albumin: 22, PO4: 1.0, Glucose: 8.2, Hb: 115, Crea: 180 } },
    { name: "Chronic COPD", description: "Respiratory acidosis, compensatory HCO3", data: { pH: 7.32, pCO2: 74, pO2: 54, HCO3: 42, Na: 138, K: 4.5, Cl: 98, iCa: 1.15, Lactate: 1.8, Albumin: 42, PO4: 1.0, Glucose: 5.2, Hb: 180, Crea: 95 } },
    { name: "DKA", description: "High AG acidosis, hyperglycaemia, K+", data: { pH: 7.18, pCO2: 22, pO2: 102, HCO3: 11, Na: 132, K: 5.8, Cl: 108, iCa: 1.10, Lactate: 2.2, Albumin: 40, PO4: 1.0, Glucose: 28.3, Hb: 160, Crea: 110 } },
    { name: "Salicylate Overdose", description: "Mixed respiratory alkalosis + metabolic acidosis", data: { pH: 7.42, pCO2: 18, pO2: 110, HCO3: 12, Na: 140, K: 4.2, Cl: 105, iCa: 1.23, Lactate: 1.5, Albumin: 38, PO4: 1.0, Glucose: 7.8, Hb: 145, Crea: 92 } }
];

function initCases() {
    const container = document.getElementById('caseOptions');
    cases.forEach((caseObj, idx) => {
        const btn = document.createElement('button');
        btn.className = 'case-btn';
        btn.innerHTML = `<div class="case-name">${caseObj.name}</div><div class="case-desc">${caseObj.description}</div>`;
        btn.onclick = () => loadCase(idx);
        container.appendChild(btn);
    });
}

function loadCase(idx) {
    const caseData = cases[idx];
    Object.keys(caseData.data).forEach(key => {
        document.getElementById(key).value = caseData.data[key];
    });
    document.querySelectorAll('.case-btn').forEach((btn, i) => btn.classList.toggle('active', i === idx));
    analyzeCase();
}

function switchTab(tabName) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    document.getElementById(tabName).classList.add('active');
    event.target.classList.add('active');
}

function analyzeCase() {
    const data = {
        pH: parseFloat(document.getElementById('pH').value) || 7.40,
        pCO2: parseFloat(document.getElementById('pCO2').value) || 40,
        pO2: parseFloat(document.getElementById('pO2').value) || 90,
        HCO3: parseFloat(document.getElementById('HCO3').value) || 24,
        Na: parseFloat(document.getElementById('Na').value) || 140,
        K: parseFloat(document.getElementById('K').value) || 4.0,
        Cl: parseFloat(document.getElementById('Cl').value) || 105,
        iCa: parseFloat(document.getElementById('iCa').value) || 1.20,
        Lactate: parseFloat(document.getElementById('Lactate').value) || 1.5,
        Albumin: parseFloat(document.getElementById('Albumin').value) || 40,
        PO4: parseFloat(document.getElementById('PO4').value) || 1.0,
        Glucose: parseFloat(document.getElementById('Glucose').value) || 5.0,
        Hb: parseFloat(document.getElementById('Hb').value) || 140,
        Crea: parseFloat(document.getElementById('Crea').value) || 90
    };

    const BEecf = -0.93 * (24 - data.HCO3) - 16 * (7.40 - data.pH);
    const AnGap = data.Na - (data.Cl + data.HCO3);
    const AG_corrected = AnGap + ((40 - data.Albumin) / 4);
    const acidaemia = data.pH < 7.35;
    const SID = (data.Na + data.K + 2*data.iCa) - (data.Cl + data.Lactate);
    const Atot = (data.Albumin/10) * (0.123 * data.pH - 0.631) + (data.PO4/10) * (0.309 * data.pH - 0.469);
    const predicted_pH = 7.4 + 0.16*(SID-38) + 0.04*(Atot-18) - 0.084*((data.pCO2-40)/7.5);

    document.getElementById('hughesOutput').innerHTML = buildHughesBrain(data, BEecf, AnGap, AG_corrected, acidaemia);
    document.getElementById('stewartOutput').innerHTML = buildStewart(data, SID, Atot, predicted_pH);
    document.getElementById('traditionalOutput').innerHTML = buildTraditional(data, AnGap, AG_corrected, BEecf, acidaemia);
    document.getElementById('figgeOutput').innerHTML = buildFigge(data, predicted_pH);
    setupSliders();
}

function setupSliders() {
    ['k-slider', 'albumin-slider', 'lactate-slider', 'hb-slider'].forEach(id => {
        const slider = document.getElementById(id);
        if (slider) slider.addEventListener('input', (e) => {
            document.getElementById(e.target.getAttribute('data-param')).value = parseFloat(e.target.value);
            analyzeCase();
        });
    });
    ['na-slider', 'cl-slider', 'albumin-slider-stew', 'po4-slider', 'pco2-slider'].forEach(id => {
        const slider = document.getElementById(id);
        if (slider) slider.addEventListener('input', (e) => {
            document.getElementById(e.target.getAttribute('data-param')).value = parseFloat(e.target.value);
            analyzeCase();
        });
    });
}

function buildHughesBrain(d, BE, AG, AGc, acid) {
    let h = '<div class="analysis-section"><div class="section-title">Hughes & Brain: 8-Step Analysis (Step → Interpretation)</div>';
    h += '<div style="margin-bottom: 24px;">';
    h += '<div class="flowchart-row"><div class="flowchart-box"><strong>Step 1<br/>pH</strong><br/>' + d.pH.toFixed(2) + '</div><div class="flowchart-arrow">→</div><div class="interpretation">' + (acid ? '🔴 ACIDAEMIA' : d.pH > 7.45 ? '🔵 ALKALAEMIA' : '🟢 NORMAL') + '</div></div>';
    h += '<div class="flowchart-row"><div class="flowchart-box"><strong>Step 2<br/>pCO2</strong><br/>' + d.pCO2.toFixed(0) + ' mmHg</div><div class="flowchart-arrow">→</div><div class="interpretation">' + (d.pCO2 > 45 ? '↑ HYPOVENTILATION' : d.pCO2 < 35 ? '↓ HYPERVENTILATION' : '✓ Normal (35-45)') + '</div></div>';
    h += '<div class="flowchart-row"><div class="flowchart-box"><strong>Step 3<br/>BEecf</strong><br/>' + BE.toFixed(1) + '</div><div class="flowchart-arrow">→</div><div class="interpretation">' + (BE < -3 ? '🔴 METABOLIC ACIDOSIS' : BE > 3 ? '🔵 METABOLIC ALKALOSIS' : '🟢 Normal') + '</div></div>';
    h += '<div class="flowchart-row"><div class="flowchart-box"><strong>Steps 4–5<br/>Anion Gap</strong><br/>Raw: ' + AG.toFixed(0) + '<br/>Corr: ' + AGc.toFixed(1) + '</div><div class="flowchart-arrow">→</div><div class="interpretation">' + (AGc > 16 ? '🔴 HIGH AG (HAGMA)' : '🟢 NORMAL AG') + '</div></div>';
    h += '<div class="flowchart-row"><div class="flowchart-box"><strong>Step 6<br/>Lactate</strong><br/>' + d.Lactate.toFixed(1) + ' mmol/L</div><div class="flowchart-arrow">→</div><div class="interpretation">' + (d.Lactate > 4 ? '🔴 SEVERE' : d.Lactate > 2.2 ? '🟡 ELEVATED' : '🟢 NORMAL') + '</div></div>';
    h += '<div class="flowchart-row"><div class="flowchart-box"><strong>Step 7<br/>Electrolytes</strong><br/>Na ' + d.Na.toFixed(0) + ' | K ' + d.K.toFixed(1) + '<br/>Cl ' + d.Cl.toFixed(0) + '</div><div class="flowchart-arrow">→</div><div class="interpretation">' + (d.Na < 135 || d.Na > 145 ? '⚠️ Na abnormal' : d.K > 5.5 || d.K < 3.5 ? '⚠️ K abnormal' : '✓ Normal') + '</div></div>';
    h += '<div class="flowchart-row"><div class="flowchart-box"><strong>Step 8<br/>Clinical</strong><br/>Crea ' + d.Crea + '<br/>Glu ' + d.Glucose.toFixed(1) + ' | Hb ' + d.Hb + '</div><div class="flowchart-arrow">→</div><div class="interpretation">Assess: Renal function, glucose control, O2 capacity</div></div>';
    h += '</div>';
    
    h += '<div style="margin-top: 20px; padding: 12px; background: var(--bg-tertiary); border-radius: 6px; border-top: 2px solid var(--accent-normal);"><strong style="display: block; margin-bottom: 16px; color: var(--accent-normal);">KEY DRIVERS: Interactive sliders</strong>';
    h += '<div class="slider-group"><div class="slider-label"><span>K (Potassium)</span><span class="slider-label-value">' + d.K.toFixed(1) + ' mmol/L</span></div><input type="range" id="k-slider" min="2" max="8" step="0.1" value="' + d.K + '" data-param="K"><div style="font-size: 0.8rem; color: var(--text-secondary); margin-top: 4px;">Normal: 3.5–5.2 | Membrane potential & cardiac effects</div></div>';
    h += '<div class="slider-group"><div class="slider-label"><span>Albumin</span><span class="slider-label-value">' + d.Albumin.toFixed(0) + ' g/L</span></div><input type="range" id="albumin-slider" min="20" max="60" step="1" value="' + d.Albumin + '" data-param="Albumin"><div style="font-size: 0.8rem; color: var(--text-secondary); margin-top: 4px;">Normal: 35–50 | Main unmeasured anion</div></div>';
    h += '<div class="slider-group"><div class="slider-label"><span>Lactate</span><span class="slider-label-value">' + d.Lactate.toFixed(1) + ' mmol/L</span></div><input type="range" id="lactate-slider" min="0.5" max="20" step="0.1" value="' + d.Lactate + '" data-param="Lactate"><div style="font-size: 0.8rem; color: var(--text-secondary); margin-top: 4px;">Normal: 0.5–2.2 | Tissue perfusion</div></div>';
    h += '<div class="slider-group"><div class="slider-label"><span>Haemoglobin</span><span class="slider-label-value">' + d.Hb.toFixed(0) + ' g/L</span></div><input type="range" id="hb-slider" min="60" max="200" step="5" value="' + d.Hb + '" data-param="Hb"><div style="font-size: 0.8rem; color: var(--text-secondary); margin-top: 4px;">Normal: 120–180 | O2 carrying capacity</div></div>';
    
    h += '<div class="perturbation-summary"><strong>CRITICAL DRIVER SUMMARY:</strong><br/>';
    let drv = '';
    if (d.K > 5.5) drv += '🔴 <strong>Hyperkalaemia</strong> (K ' + d.K.toFixed(1) + ') – CARDIAC RISK<br/>';
    else if (d.K < 3.5) drv += '🔴 <strong>Hypokalaemia</strong> (K ' + d.K.toFixed(1) + ') – Arrhythmia risk<br/>';
    if (d.Albumin < 30) drv += '🔴 <strong>Severe hypoalbuminaemia</strong> (' + d.Albumin.toFixed(0) + ' g/L)<br/>';
    else if (d.Albumin < 35) drv += '🟡 <strong>Hypoalbuminaemia</strong> (' + d.Albumin.toFixed(0) + ' g/L)<br/>';
    if (d.Lactate > 4) drv += '🔴 <strong>Severe hyperlactataemia</strong> (' + d.Lactate.toFixed(1) + ') – TISSUE HYPOXIA<br/>';
    else if (d.Lactate > 2.2) drv += '🟡 <strong>Elevated lactate</strong> (' + d.Lactate.toFixed(1) + ')<br/>';
    if (d.Hb < 90) drv += '🔴 <strong>Severe anaemia</strong> (' + d.Hb + ' g/L)<br/>';
    else if (d.Hb < 100) drv += '🟡 <strong>Moderate anaemia</strong> (' + d.Hb + ' g/L)<br/>';
    h += (drv || '✓ No critical drivers identified') + '</div>';
    
    h += '</div></div>';
    return h;
}

function buildStewart(d, SID, Atot, pred_pH) {
    let h = '<div class="analysis-section"><div class="section-title">Stewart: Three Independent Variables (Step → Interpretation)</div>';
    h += '<div style="margin-bottom: 24px;">';
    h += '<div class="flowchart-row"><div class="flowchart-box"><strong>Variable 1<br/>SID</strong><br/>SID = ' + SID.toFixed(1) + ' mEq/L<br/><span style="font-size: 0.8rem;">(Na ' + d.Na.toFixed(0) + ' + K ' + d.K.toFixed(1) + ')<br/>−(Cl ' + d.Cl.toFixed(0) + ' + Lac ' + d.Lactate.toFixed(1) + ')</span></div><div class="flowchart-arrow">→</div><div class="interpretation">' + (SID < 38 ? '🔴 LOW (Acidifying)' : SID > 42 ? '🔵 HIGH (Alkalinizing)' : '🟢 NORMAL (38-42)') + '</div></div>';
    h += '<div class="flowchart-row"><div class="flowchart-box"><strong>Variable 2<br/>Atot</strong><br/>Atot = ' + Atot.toFixed(1) + ' mEq/L<br/><span style="font-size: 0.8rem;">(Albumin +<br/>Phosphate)</span></div><div class="flowchart-arrow">→</div><div class="interpretation">' + (Atot < 18 ? '🔴 LOW (Acidifying)' : Atot > 18 ? '🔵 HIGH (Alkalinizing)' : '🟢 NORMAL (~18)') + '</div></div>';
    h += '<div class="flowchart-row"><div class="flowchart-box"><strong>Variable 3<br/>pCO2</strong><br/>pCO2 = ' + d.pCO2.toFixed(0) + ' mmHg</div><div class="flowchart-arrow">→</div><div class="interpretation">' + (d.pCO2 < 35 ? '↓ Low (Alkalinizing)' : d.pCO2 > 45 ? '↑ High (Acidifying)' : '✓ Normal (35-45)') + '</div></div>';
    h += '<div class="flowchart-row"><div class="flowchart-box"><strong>PREDICTED pH<br/>(Stewart Eqn)</strong><br/>7.4 + 0.16(SID-38)<br/>+ 0.04(Atot-18)<br/>- 0.084(pCO2-40)/7.5</div><div class="flowchart-arrow">→</div><div class="interpretation"><strong style="color: var(--accent-normal); font-size: 1.1rem;">pH = ' + pred_pH.toFixed(2) + '</strong><br/>Measured: ' + d.pH.toFixed(2) + '<br/>Δ: ' + (d.pH - pred_pH).toFixed(3) + ' ' + (Math.abs(d.pH - pred_pH) > 0.1 ? '⚠️' : '✓') + '</div></div>';
    h += '</div>';
    
    h += '<div style="margin-top: 20px; padding: 12px; background: var(--bg-tertiary); border-radius: 6px; border-top: 2px solid var(--accent-normal);"><strong style="display: block; margin-bottom: 16px; color: var(--accent-normal);">INTERACTIVE: Adjust variables and watch SID, Atot, and predicted pH change</strong>';
    
    h += '<div style="padding: 12px; margin-bottom: 16px; background: var(--bg-secondary); border-radius: 4px; border-left: 3px solid var(--accent-warning);"><strong style="display: block; margin-bottom: 12px;">SID Modifiers (↓ = More Acidic)</strong>';
    h += '<div class="slider-group"><div class="slider-label"><span>Na (Sodium)</span><span class="slider-label-value">' + d.Na.toFixed(0) + '</span></div><input type="range" id="na-slider" min="110" max="160" step="1" value="' + d.Na + '" data-param="Na"></div>';
    h += '<div class="slider-group"><div class="slider-label"><span>Cl (Chloride)</span><span class="slider-label-value">' + d.Cl.toFixed(0) + '</span></div><input type="range" id="cl-slider" min="80" max="120" step="1" value="' + d.Cl + '" data-param="Cl"></div>';
    h += '</div>';
    
    h += '<div style="padding: 12px; margin-bottom: 16px; background: var(--bg-secondary); border-radius: 4px; border-left: 3px solid var(--accent-warning);"><strong style="display: block; margin-bottom: 12px;">Atot Modifiers</strong>';
    h += '<div class="slider-group"><div class="slider-label"><span>Albumin</span><span class="slider-label-value">' + d.Albumin.toFixed(0) + ' g/L</span></div><input type="range" id="albumin-slider-stew" min="20" max="60" step="1" value="' + d.Albumin + '" data-param="Albumin"></div>';
    h += '<div class="slider-group"><div class="slider-label"><span>PO4 (Phosphate)</span><span class="slider-label-value">' + d.PO4.toFixed(1) + '</span></div><input type="range" id="po4-slider" min="0.5" max="2.5" step="0.1" value="' + d.PO4 + '" data-param="PO4"></div>';
    h += '</div>';
    
    h += '<div style="padding: 12px; background: var(--bg-secondary); border-radius: 4px; border-left: 3px solid var(--accent-warning);"><strong style="display: block; margin-bottom: 12px;">Respiratory Component</strong>';
    h += '<div class="slider-group"><div class="slider-label"><span>pCO2</span><span class="slider-label-value">' + d.pCO2.toFixed(0) + ' mmHg</span></div><input type="range" id="pco2-slider" min="10" max="100" step="1" value="' + d.pCO2 + '" data-param="pCO2"></div>';
    h += '</div>';
    
    h += '<div class="perturbation-summary"><strong>DRIVER ANALYSIS:</strong><br/>';
    let sid_status = '';
    if (SID < 35) sid_status = '🔴 SID critically low – aggressive fluid resuscitation needed';
    else if (SID < 38) sid_status = '🟡 SID low – acidifying effect';
    else if (SID > 42) sid_status = '🔵 SID high – alkalinizing effect';
    else sid_status = '✓ SID normal';
    let atot_status = '';
    if (d.Albumin < 20) atot_status = '  |  🔴 Severe hypoalbuminaemia – unmeasured anion effect critical';
    else if (d.Albumin < 35) atot_status = '  |  🟡 Low Atot – unmeasured anion effect present';
    h += sid_status + atot_status + '</div>';
    
    h += '</div></div>';
    return h;
}

function buildTraditional(d, AG, AGc, BE, acid) {
    let h = '<div class="analysis-section"><div class="section-title">Traditional Boston: Pattern Recognition & Mnemonics</div>';
    h += '<div class="step-box"><strong>STEP 1: pH Status</strong><br/>pH = ' + d.pH.toFixed(2) + ' → ' + (acid ? '🔴 ACIDAEMIA' : d.pH > 7.45 ? '🔵 ALKALAEMIA' : '🟢 NORMAL') + '</div>';
    h += '<div class="step-box"><strong>STEP 2: Respiratory Response (Winter\'s Formula)</strong><br/>';
    if (acid) {
        const exp_pCO2 = 1.5 * d.HCO3 + 8;
        h += 'Expected pCO2 = 1.5 × ' + d.HCO3.toFixed(0) + ' + 8 ±2 = ' + exp_pCO2.toFixed(0) + ' mmHg<br/>Measured pCO2 = ' + d.pCO2.toFixed(0) + ' mmHg<br/>';
        if (d.pCO2 < exp_pCO2 - 2) h += '🔵 Appropriate respiratory compensation';
        else if (d.pCO2 > exp_pCO2 + 2) h += '🔴 Concurrent respiratory acidosis';
        else h += '✓ Appropriate';
    } else {
        h += 'pCO2 = ' + d.pCO2.toFixed(0) + ' mmHg (Alkalaemia context)';
    }
    h += '</div>';
    h += '<div class="step-box"><strong>STEP 3: Anion Gap</strong><br/>AG = Na − (Cl + HCO3) = ' + AG.toFixed(0) + '<br/>Corrected AG (for Albumin ' + d.Albumin.toFixed(0) + ') = ' + AGc.toFixed(1) + ' → ' + (AGc > 16 ? '🔴 HIGH (HAGMA)' : '🟢 NORMAL') + '</div>';
    h += '<div class="step-box"><strong>STEP 4: Delta Ratio (if HAGMA)</strong><br/>';
    if (AGc > 16) {
        const delta = (AG - 12) / (24 - d.HCO3);
        h += 'Δ AG / Δ HCO3 = (' + AG.toFixed(0) + ' − 12) / (24 − ' + d.HCO3.toFixed(0) + ') = ' + delta.toFixed(2) + '<br/>';
        if (delta > 2) h += '🔵 Concurrent metabolic alkalosis (HCO3 preserved)';
        else if (delta < 1) h += '🔴 Concurrent NAGMA (HCO3 overcorrected)';
        else h += '✓ Pure HAGMA';
    } else {
        h += 'No HAGMA → Check NAGMA causes';
    }
    h += '</div>';
    h += '<div class="step-box"><strong>STEP 5: Differential & Mnemonics</strong><br/>';
    if (acid) {
        if (AGc > 16) {
            h += '🔴 <strong style="color: var(--accent-normal);">HIGH AG METABOLIC ACIDOSIS (HAGMA)</strong><br/>';
            h += '<strong style="color: var(--accent-normal);">GOLDMARK – Toxins & Unmeasured Anions:</strong><br/>';
            h += '• <strong>G</strong>lycols (ethylene, propylene) • <strong>O</strong>xoproline (paracetamol, TPN) • <strong>L</strong>-lactate (hypoxia, sepsis, shock)<br/>';
            h += '• <strong>D</strong>-lactate (short bowel, bacterial overgrowth) • <strong>M</strong>ethanol • <strong>A</strong>spirin (salicylate)<br/>';
            h += '• <strong>R</strong>enal failure (uraemia) • <strong>K</strong>etoacidosis (DKA, alcoholic, starvation)';
        } else {
            h += '🔴 <strong style="color: var(--accent-normal);">NORMAL AG METABOLIC ACIDOSIS (NAGMA/Hyperchloraemic)</strong><br/>';
            h += '<strong style="color: var(--accent-normal);">USEDCARS – Causes of Normal AG Acidosis:</strong><br/>';
            h += '• <strong>U</strong>reterosigmoidostomy (GI HCO3 loss) • <strong>S</strong>aline (0.9% NaCl excess) • <strong>E</strong>ndocrine (Addison\'s)<br/>';
            h += '• <strong>D</strong>iarrhoea (GI HCO3 loss) • <strong>C</strong>arbonic anhydrase inhibitors • <strong>A</strong>mmonium chloride<br/>';
            h += '• <strong>R</strong>enal tubular acidosis (RTA 1/2/4) • <strong>S</strong>pironolactone (type 4 RTA)';
        }
    } else if (d.pH > 7.45) {
        h += '🔵 <strong>ALKALAEMIA</strong> – Assess HCO3 and respiratory drive<br/>Metabolic alkalosis: Contraction (saline loss, vomiting) vs Exogenous alkali';
    }
    h += '</div>';
    return h + '</div>';
}

function buildFigge(d, pred_pH) {
    let h = '<div class="analysis-section"><div class="section-title">Figge-Fencl: Unmeasured Ions Detection</div>';
    h += '<div class="step-box"><strong>Predicted vs Measured pH</strong><br/>Predicted (Stewart): ' + pred_pH.toFixed(2) + '<br/>Measured (iSTAT): ' + d.pH.toFixed(2) + '<br/>Difference: ' + (d.pH - pred_pH).toFixed(3) + '<br/>';
    if (Math.abs(d.pH - pred_pH) > 0.1) {
        h += '⚠️ <strong>SIGNIFICANT DISCREPANCY – Unmeasured ions present</strong><br/>Consider unmeasured cations (Mg, Ca) or anions (proteins, SO4)';
    } else {
        h += '✓ Measured ions adequately explain the pH';
    }
    h += '</div></div>';
    return h;
}
