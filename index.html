<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iSTAT ABG Master Analyzer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-primary: #0d1117;
            --bg-secondary: #1c2128;
            --bg-tertiary: #262c36;
            --text-primary: #e6edf3;
            --text-secondary: #8b949e;
            --border: #30363d;
            --accent-normal: #58a6ff;
            --accent-warning: #d29922;
            --accent-critical: #f85149;
            --accent-safe: #3fb950;
            --font-display: 'Monaco', 'Courier New', monospace;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg-primary); color: var(--text-primary); padding: 20px; line-height: 1.6; }
        .container { max-width: 1400px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 30px; padding: 20px; border-bottom: 2px solid var(--border); }
        .header h1 { font-size: 1.8rem; margin-bottom: 8px; color: var(--accent-normal); }
        .header p { color: var(--text-secondary); font-size: 0.9rem; }
        .case-selector { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 24px; padding: 20px; background: var(--bg-secondary); border-radius: 8px; }
        .case-btn { padding: 12px 16px; background: var(--bg-tertiary); color: var(--text-primary); border: 2px solid var(--border); border-radius: 6px; cursor: pointer; font-size: 0.9rem; transition: all 0.2s; text-align: left; }
        .case-btn:hover { border-color: var(--accent-normal); background: var(--bg-primary); }
        .case-btn.active { border-color: var(--accent-normal); background: rgba(88, 166, 255, 0.1); }
        .case-name { font-weight: 600; margin-bottom: 4px; }
        .case-desc { font-size: 0.8rem; color: var(--text-secondary); }
        .input-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 24px; padding: 20px; background: var(--bg-secondary); border-radius: 8px; }
        .input-group { display: flex; flex-direction: column; }
        .input-group label { font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 4px; font-weight: 500; }
        .input-group input { padding: 8px 12px; background: var(--bg-tertiary); border: 1px solid var(--border); color: var(--text-primary); border-radius: 4px; font-family: var(--font-display); }
        .input-group input:focus { outline: none; border-color: var(--accent-normal); box-shadow: 0 0 0 2px rgba(88, 166, 255, 0.1); }
        .btn-analyze { padding: 12px 24px; background: var(--accent-normal); color: var(--bg-primary); border: none; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 1rem; transition: background 0.2s; width: 100%; }
        .btn-analyze:hover { background: #4184e4; }
        .tabs { display: flex; gap: 12px; margin-bottom: 24px; border-bottom: 2px solid var(--border); flex-wrap: wrap; }
        .tab-btn { padding: 12px 20px; background: none; border: none; color: var(--text-secondary); cursor: pointer; font-size: 0.95rem; border-bottom: 3px solid transparent; transition: all 0.2s; margin-bottom: -2px; }
        .tab-btn:hover { color: var(--text-primary); }
        .tab-btn.active { color: var(--accent-normal); border-bottom-color: var(--accent-normal); }
        .tab-content { display: none; padding: 20px; background: var(--bg-secondary); border-radius: 8px; }
        .tab-content.active { display: block; }
        .analysis-section { padding: 16px; background: var(--bg-tertiary); border-left: 4px solid var(--accent-normal); border-radius: 6px; margin-bottom: 20px; }
        .section-title { font-weight: 600; font-size: 1rem; margin-bottom: 16px; color: var(--accent-normal); font-family: var(--font-display); }
        .flowchart-box { padding: 12px; margin: 8px 0; background: var(--bg-secondary); border: 2px solid var(--border); border-radius: 6px; text-align: center; font-weight: 500; font-size: 0.9rem; }
        .flowchart-arrow { text-align: center; color: var(--text-secondary); margin: 4px 0; font-size: 1.2rem; }
        .slider-group { margin: 20px 0; padding: 16px; background: var(--bg-primary); border-radius: 6px; border: 1px solid var(--border); }
        .slider-label { display: flex; justify-content: space-between; font-size: 0.9rem; margin-bottom: 8px; font-weight: 500; }
        .slider-label-value { color: var(--accent-normal); font-family: var(--font-display); }
        input[type="range"] { width: 100%; height: 6px; border-radius: 3px; background: var(--border); outline: none; -webkit-appearance: none; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 18px; height: 18px; border-radius: 50%; background: var(--accent-normal); cursor: pointer; transition: background 0.2s; }
        input[type="range"]::-webkit-slider-thumb:hover { background: #4184e4; }
        input[type="range"]::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: var(--accent-normal); cursor: pointer; border: none; transition: background 0.2s; }
        input[type="range"]::-moz-range-thumb:hover { background: #4184e4; }
        .perturbation-summary { padding: 16px; background: rgba(94, 234, 212, 0.05); border-left: 3px solid var(--accent-safe); border-radius: 4px; margin-top: 20px; font-size: 0.9rem; line-height: 1.7; }
        .disclaimer { padding: 12px; background: rgba(210, 153, 34, 0.1); border-left: 3px solid var(--accent-warning); margin-bottom: 20px; border-radius: 4px; font-size: 0.85rem; color: var(--text-secondary); }
        .step-box { padding: 12px; background: var(--bg-secondary); border-left: 3px solid var(--accent-warning); margin: 12px 0; border-radius: 4px; font-size: 0.9rem; line-height: 1.7; }
        .two-column { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        @media (max-width: 1024px) { .two-column { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
<div class="container">
    <div class="disclaimer">
        <strong>⚠️ DISCLAIMER:</strong> Educational tool only. Always correlate with clinical context and verify calculations using current institutional protocols.
    </div>

    <div class="header">
        <h1>iSTAT CG8+ ABG Master Analyzer</h1>
        <p>Hughes & Brain | Stewart | Traditional Boston | Figge-Fencl</p>
    </div>

    <div class="case-selector" id="caseOptions">
        <h3 style="grid-column: 1/-1; margin-bottom: 12px; color: var(--text-secondary);">SELECT A TEST CASE</h3>
    </div>

    <div class="input-grid">
        <div class="input-group"><label>pH</label><input type="number" id="pH" step="0.01" min="6" max="8" placeholder="7.35"></div>
        <div class="input-group"><label>pCO2 (mmHg)</label><input type="number" id="pCO2" step="1" min="10" max="100" placeholder="40"></div>
        <div class="input-group"><label>pO2 (mmHg)</label><input type="number" id="pO2" step="1" min="20" max="200" placeholder="90"></div>
        <div class="input-group"><label>HCO3 (mmol/L)</label><input type="number" id="HCO3" step="0.1" min="1" max="60" placeholder="24"></div>
        <div class="input-group"><label>Na (mmol/L)</label><input type="number" id="Na" step="1" min="110" max="160" placeholder="140"></div>
        <div class="input-group"><label>K (mmol/L)</label><input type="number" id="K" step="0.1" min="2" max="8" placeholder="4.0"></div>
        <div class="input-group"><label>Cl (mmol/L)</label><input type="number" id="Cl" step="1" min="80" max="120" placeholder="105"></div>
        <div class="input-group"><label>iCa (mmol/L)</label><input type="number" id="iCa" step="0.01" min="0.5" max="2" placeholder="1.20"></div>
        <div class="input-group"><label>Lactate (mmol/L)</label><input type="number" id="Lactate" step="0.1" min="0" max="20" placeholder="1.5"></div>
        <div class="input-group"><label>Albumin (g/L)</label><input type="number" id="Albumin" step="1" min="20" max="60" placeholder="40"></div>
        <div class="input-group"><label>PO4 (mmol/L)</label><input type="number" id="PO4" step="0.1" min="0.5" max="2.5" placeholder="1.0"></div>
        <div class="input-group"><label>Glucose (mmol/L)</label><input type="number" id="Glucose" step="0.1" min="1" max="40" placeholder="5.0"></div>
        <div class="input-group"><label>Hb (g/L)</label><input type="number" id="Hb" step="5" min="60" max="200" placeholder="140"></div>
        <div class="input-group"><label>Creatinine (μmol/L)</label><input type="number" id="Crea" step="5" min="30" max="300" placeholder="90"></div>
    </div>

    <button class="btn-analyze" onclick="analyzeCase()">ANALYZE</button>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('hughes')">Hughes & Brain</button>
        <button class="tab-btn" onclick="switchTab('stewart')">Stewart</button>
        <button class="tab-btn" onclick="switchTab('traditional')">Traditional</button>
        <button class="tab-btn" onclick="switchTab('figge')">Figge-Fencl</button>
    </div>

    <div id="hughes" class="tab-content active"><div id="hughesOutput"></div></div>
    <div id="stewart" class="tab-content"><div id="stewartOutput"></div></div>
    <div id="traditional" class="tab-content"><div id="traditionalOutput"></div></div>
    <div id="figge" class="tab-content"><div id="figgeOutput"></div></div>
</div>

<script>
const cases = [
    { name: "Septic Shock", description: "High lactate, low albumin, AKI, K+", data: { pH: 7.28, pCO2: 31, pO2: 87, HCO3: 16, Na: 128, K: 5.8, Cl: 102, iCa: 0.92, Lactate: 8.5, Albumin: 22, PO4: 1.0, Glucose: 8.2, Hb: 115, Crea: 180 } },
    { name: "Chronic COPD", description: "Respiratory acidosis, compensatory HCO3", data: { pH: 7.32, pCO2: 74, pO2: 54, HCO3: 42, Na: 138, K: 4.5, Cl: 98, iCa: 1.15, Lactate: 1.8, Albumin: 42, PO4: 1.0, Glucose: 5.2, Hb: 180, Crea: 95 } },
    { name: "DKA", description: "High AG acidosis, hyperglycaemia, K+", data: { pH: 7.18, pCO2: 22, pO2: 102, HCO3: 11, Na: 132, K: 5.8, Cl: 108, iCa: 1.10, Lactate: 2.2, Albumin: 40, PO4: 1.0, Glucose: 28.3, Hb: 160, Crea: 110 } },
    { name: "Salicylate Overdose", description: "Mixed respiratory alkalosis + metabolic acidosis", data: { pH: 7.42, pCO2: 18, pO2: 110, HCO3: 12, Na: 140, K: 4.2, Cl: 105, iCa: 1.23, Lactate: 1.5, Albumin: 38, PO4: 1.0, Glucose: 7.8, Hb: 145, Crea: 92 } }
];

function initCases() {
    const container = document.getElementById('caseOptions');
    cases.forEach((caseObj, idx) => {
        const btn = document.createElement('button');
        btn.className = 'case-btn';
        btn.innerHTML = '<div class="case-name">' + caseObj.name + '</div><div class="case-desc">' + caseObj.description + '</div>';
        btn.onclick = () => loadCase(idx);
        container.appendChild(btn);
    });
}

function loadCase(idx) {
    const caseData = cases[idx];
    Object.keys(caseData.data).forEach(key => {
        document.getElementById(key).value = caseData.data[key];
    });
    document.querySelectorAll('.case-btn').forEach((btn, i) => btn.classList.toggle('active', i === idx));
    analyzeCase();
}

function switchTab(tabName) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    document.getElementById(tabName).classList.add('active');
    event.target.classList.add('active');
}

function analyzeCase() {
    const d = {
        pH: parseFloat(document.getElementById('pH').value) || 7.40,
        pCO2: parseFloat(document.getElementById('pCO2').value) || 40,
        pO2: parseFloat(document.getElementById('pO2').value) || 90,
        HCO3: parseFloat(document.getElementById('HCO3').value) || 24,
        Na: parseFloat(document.getElementById('Na').value) || 140,
        K: parseFloat(document.getElementById('K').value) || 4.0,
        Cl: parseFloat(document.getElementById('Cl').value) || 105,
        iCa: parseFloat(document.getElementById('iCa').value) || 1.20,
        Lactate: parseFloat(document.getElementById('Lactate').value) || 1.5,
        Albumin: parseFloat(document.getElementById('Albumin').value) || 40,
        PO4: parseFloat(document.getElementById('PO4').value) || 1.0,
        Glucose: parseFloat(document.getElementById('Glucose').value) || 5.0,
        Hb: parseFloat(document.getElementById('Hb').value) || 140,
        Crea: parseFloat(document.getElementById('Crea').value) || 90
    };

    const BEecf = -0.93 * (24 - d.HCO3) - 16 * (7.40 - d.pH);
    const AnGap = d.Na - (d.Cl + d.HCO3);
    const AG_corrected = AnGap + ((40 - d.Albumin) / 4);
    const acidaemia = d.pH < 7.35;
    const SID = (d.Na + d.K + 2*d.iCa) - (d.Cl + d.Lactate);
    const Atot = (d.Albumin/10) * (0.123 * d.pH - 0.631) + (d.PO4/10) * (0.309 * d.pH - 0.469);
    const predicted_pH = 7.4 + 0.16*(SID-38) + 0.04*(Atot-18) - 0.084*((d.pCO2-40)/7.5);
    const Cl_corrected = d.Cl * (140 / d.Na);

    document.getElementById('hughesOutput').innerHTML = buildHughesBrain(d, BEecf, AnGap, AG_corrected, acidaemia, Cl_corrected);
    document.getElementById('stewartOutput').innerHTML = buildStewart(d, SID, Atot, predicted_pH);
    document.getElementById('traditionalOutput').innerHTML = buildTraditional(d, AnGap, AG_corrected, BEecf, acidaemia);
    document.getElementById('figgeOutput').innerHTML = buildFigge(d, predicted_pH);
    setupSliders();
}

function setupSliders() {
    ['k-slider', 'albumin-slider', 'lactate-slider', 'hb-slider'].forEach(id => {
        const slider = document.getElementById(id);
        if (slider) slider.addEventListener('input', e => {
            const param = e.target.getAttribute('data-param');
            document.getElementById(param).value = parseFloat(e.target.value);
            analyzeCase();
        });
    });
    ['na-slider', 'cl-slider', 'albumin-slider-stew', 'po4-slider', 'pco2-slider'].forEach(id => {
        const slider = document.getElementById(id);
        if (slider) slider.addEventListener('input', e => {
            const param = e.target.getAttribute('data-param');
            document.getElementById(param).value = parseFloat(e.target.value);
            analyzeCase();
        });
    });
}

function buildHughesBrain(d, BEecf, AnGap, AG_corrected, acidaemia, Cl_corrected) {
    let h = '<div class="analysis-section"><div class="section-title">Hughes & Brain: Step-by-Step Bedside Analysis</div>';
    h += '<div class="two-column">';
    
    // LEFT COLUMN: Assessment steps
    h += '<div><h3 style="color: var(--accent-normal); margin-bottom: 12px; font-size: 0.95rem;">LEFT: Assessment Steps</h3>';
    h += '<div class="flowchart-box"><strong>Step 1-2</strong><br/>History, PaO2 = ' + d.pO2.toFixed(0) + '</div>';
    h += '<div class="flowchart-arrow">↓</div>';
    h += '<div class="flowchart-box"><strong>Step 3</strong><br/>pH = ' + d.pH.toFixed(2) + '</div>';
    h += '<div class="flowchart-arrow">↓</div>';
    h += '<div class="flowchart-box"><strong>Step 4</strong><br/>pCO2 = ' + d.pCO2.toFixed(0) + '</div>';
    h += '<div class="flowchart-arrow">↓</div>';
    h += '<div class="flowchart-box"><strong>Step 5</strong><br/>Standard Base Excess = ' + BEecf.toFixed(1) + '</div>';
    h += '<div class="flowchart-arrow">↓</div>';
    h += '<div class="flowchart-box"><strong>Step 6</strong><br/>Albumin = ' + d.Albumin.toFixed(0) + ' g/L</div>';
    h += '<div class="flowchart-arrow">↓</div>';
    h += '<div class="flowchart-box"><strong>Step 7</strong><br/>Lactate = ' + d.Lactate.toFixed(1) + '</div>';
    h += '<div class="flowchart-arrow">↓</div>';
    h += '<div class="flowchart-box"><strong>Step 8</strong><br/>Anion Gap (subtract lactate, correct albumin)</div>';
    h += '<div class="flowchart-arrow">↓</div>';
    h += '<div class="flowchart-box"><strong>Step 9</strong><br/>Sodium (Tonicity)<br/>Na = ' + d.Na.toFixed(0) + '</div>';
    h += '<div class="flowchart-arrow">↓</div>';
    h += '<div class="flowchart-box"><strong>Step 10</strong><br/>Correct Chloride for Tonicity</div>';
    h += '</div>';
    
    // RIGHT COLUMN: Interpretations
    h += '<div><h3 style="color: var(--accent-normal); margin-bottom: 12px; font-size: 0.95rem;">RIGHT: Clinical Interpretation</h3>';
    h += '<div class="flowchart-box"><strong>Acidaemia/Alkalaemia<br/>Summation of all processes below</strong><br/>' + (acidaemia ? '🔴 ACIDAEMIA' : d.pH > 7.45 ? '🔵 ALKALAEMIA' : '🟢 NORMAL') + '</div>';
    h += '<div class="flowchart-arrow">↓</div>';
    h += '<div class="flowchart-box"><strong>Respiratory Component</strong><br/>' + (d.pCO2 > 45 ? '↑ pCO2 – Respiratory acidosis' : d.pCO2 < 35 ? '↓ pCO2 – Respiratory alkalosis' : '✓ Normal (35–45)') + '</div>';
    h += '<div class="flowchart-arrow">↓</div>';
    h += '<div class="flowchart-box"><strong>Metabolic Effects</strong><br/>' + (BEecf < -2 ? '🔴 BE <-2 – Metabolic acidosis' : BEecf > 3 ? '🔵 BE >+3 – Metabolic alkalosis' : '🟢 Normal (-2 to +3)') + '</div>';
    h += '<div class="flowchart-arrow">↓</div>';
    h += '<div class="flowchart-box"><strong>Albumin Effect</strong><br/>' + (d.Albumin < 35 ? '↓Alb – Metabolic alkalosis' : d.Albumin > 45 ? '↑Alb – Acidosis (uncommon)' : '✓ Normal effect') + '</div>';
    h += '<div class="flowchart-arrow">↓</div>';
    h += '<div class="flowchart-box"><strong>Lactate Assessment</strong><br/>' + (d.Lactate > 4 ? '🔴 Severe – Metabolic acidosis' : d.Lactate > 2.2 ? '⚠️ Elevated – Metabolic acidosis' : '✓ Normal') + '</div>';
    h += '<div class="flowchart-arrow">↓</div>';
    h += '<div class="flowchart-box"><strong>Anion Gap Analysis</strong><br/>AG_corrected = ' + AG_corrected.toFixed(1) + '<br/>' + (AG_corrected > 16 ? '🔴 >16 – Metabolic acidosis<br/>Excess unmeasured anions' : '🟢 ≤16 – Normal AG') + '</div>';
    h += '<div class="flowchart-arrow">↓</div>';
    h += '<div class="flowchart-box"><strong>Sodium & Tonicity</strong><br/>Na = ' + d.Na.toFixed(0) + '<br/>' + (d.Na < 135 ? '↓Na–H2O: Dilutional acidosis' : d.Na > 145 ? '↑Na–H2O: Concentration alkalosis' : '✓ Normal (135–145)') + '</div>';
    h += '<div class="flowchart-arrow">↓</div>';
    h += '<div class="flowchart-box"><strong>Corrected Chloride</strong><br/>Cl<sub>c</sub> = ' + d.Cl.toFixed(0) + ' × (140/' + d.Na.toFixed(0) + ')<br/>Cl<sub>c</sub> = ' + Cl_corrected.toFixed(1) + '<br/>' + (Cl_corrected > 110 ? '🔴 ↑Cl – Hyperchloraemic acidosis' : Cl_corrected < 95 ? '🔴 ↓Cl – Hyperchloraemic alkalosis' : '✓ Normal (95–110)') + '</div>';
    h += '</div></div>';
    
    // Sliders section
    h += '<div style="margin-top: 30px; padding: 12px; background: var(--bg-tertiary); border-radius: 6px;"><strong style="color: var(--accent-normal); display: block; margin-bottom: 12px;">KEY DRIVERS: Adjust sliders to see impact</strong>';
    h += '<div class="slider-group"><div class="slider-label"><span>K (Potassium)</span><span class="slider-label-value">' + d.K.toFixed(1) + ' mmol/L</span></div><input type="range" id="k-slider" min="2" max="8" step="0.1" value="' + d.K + '" data-param="K"><div style="font-size: 0.8rem; color: var(--text-secondary); margin-top: 4px;">Normal: 3.5–5.2</div></div>';
    h += '<div class="slider-group"><div class="slider-label"><span>Albumin</span><span class="slider-label-value">' + d.Albumin.toFixed(0) + ' g/L</span></div><input type="range" id="albumin-slider" min="20" max="60" step="1" value="' + d.Albumin + '" data-param="Albumin"><div style="font-size: 0.8rem; color: var(--text-secondary); margin-top: 4px;">Normal: 35–50</div></div>';
    h += '<div class="slider-group"><div class="slider-label"><span>Lactate</span><span class="slider-label-value">' + d.Lactate.toFixed(1) + ' mmol/L</span></div><input type="range" id="lactate-slider" min="0.5" max="20" step="0.1" value="' + d.Lactate + '" data-param="Lactate"><div style="font-size: 0.8rem; color: var(--text-secondary); margin-top: 4px;">Normal: 0.5–2.2</div></div>';
    h += '<div class="slider-group"><div class="slider-label"><span>Haemoglobin</span><span class="slider-label-value">' + d.Hb.toFixed(0) + ' g/L</span></div><input type="range" id="hb-slider" min="60" max="200" step="5" value="' + d.Hb + '" data-param="Hb"><div style="font-size: 0.8rem; color: var(--text-secondary); margin-top: 4px;">Normal: 120–180</div></div>';
    h += '</div></div>';
    
    return h;
}

function buildStewart(d, SID, Atot, predicted_pH) {
    let h = '<div class="analysis-section"><div class="section-title">Stewart: SID → Atot → pCO2 → pH</div>';
    h += '<div class="two-column">';
    h += '<div><h3 style="color: var(--accent-normal); margin-bottom: 12px; font-size: 0.95rem;">Three Independent pH Variables</h3>';
    h += '<div class="flowchart-box"><strong>1. Strong Ion Difference</strong><br/>SID = (Na ' + d.Na.toFixed(0) + ' + K ' + d.K.toFixed(1) + ') − (Cl ' + d.Cl.toFixed(0) + ' + Lactate ' + d.Lactate.toFixed(1) + ')<br/><strong style="color: var(--accent-normal);">SID = ' + SID.toFixed(1) + ' mEq/L</strong><br/>' + (SID < 38 ? '🔴 LOW' : SID > 42 ? '🔵 HIGH' : '🟢 NORMAL (38-42)') + '</div>';
    h += '<div class="flowchart-arrow">↓</div>';
    h += '<div class="flowchart-box"><strong>2. Effective Charge</strong><br/>Atot = ' + Atot.toFixed(1) + ' mEq/L<br/>' + (Atot < 18 ? '🔴 LOW' : Atot > 18 ? '🔵 HIGH' : '🟢 NORMAL (~18)') + '</div>';
    h += '<div class="flowchart-arrow">↓</div>';
    h += '<div class="flowchart-box"><strong>3. CO2 Pressure</strong><br/>pCO2 = ' + d.pCO2.toFixed(0) + ' mmHg</div>';
    h += '<div class="flowchart-arrow">↓</div>';
    h += '<div class="flowchart-box"><strong>PREDICTED pH</strong><br/>pH = 7.4 + 0.16(SID−38) + 0.04(Atot−18) − 0.084(pCO2−40)/7.5<br/><strong style="color: var(--accent-normal);">Predicted = ' + predicted_pH.toFixed(2) + '</strong><br/>Measured = ' + d.pH.toFixed(2) + '<br/>Δ = ' + (d.pH - predicted_pH).toFixed(3) + '</div></div>';
    
    h += '<div style="padding: 12px; background: var(--bg-tertiary); border-radius: 6px;"><strong style="color: var(--accent-normal); display: block; margin-bottom: 12px;">INTERACTIVE SLIDERS</strong>';
    h += '<div class="slider-group"><div class="slider-label"><span>Na</span><span class="slider-label-value">' + d.Na.toFixed(0) + ' mmol/L</span></div><input type="range" id="na-slider" min="110" max="160" step="1" value="' + d.Na + '" data-param="Na"></div>';
    h += '<div class="slider-group"><div class="slider-label"><span>Cl</span><span class="slider-label-value">' + d.Cl.toFixed(0) + ' mmol/L</span></div><input type="range" id="cl-slider" min="80" max="120" step="1" value="' + d.Cl + '" data-param="Cl"></div>';
    h += '<div class="slider-group"><div class="slider-label"><span>Albumin</span><span class="slider-label-value">' + d.Albumin.toFixed(0) + ' g/L</span></div><input type="range" id="albumin-slider-stew" min="20" max="60" step="1" value="' + d.Albumin + '" data-param="Albumin"></div>';
    h += '<div class="slider-group"><div class="slider-label"><span>PO4</span><span class="slider-label-value">' + d.PO4.toFixed(1) + ' mmol/L</span></div><input type="range" id="po4-slider" min="0.5" max="2.5" step="0.1" value="' + d.PO4 + '" data-param="PO4"></div>';
    h += '<div class="slider-group"><div class="slider-label"><span>pCO2</span><span class="slider-label-value">' + d.pCO2.toFixed(0) + ' mmHg</span></div><input type="range" id="pco2-slider" min="10" max="100" step="1" value="' + d.pCO2 + '" data-param="pCO2"></div>';
    h += '</div></div>';
    
    return h;
}

function buildTraditional(d, AnGap, AG_corrected, BEecf, acidaemia) {
    let h = '<div class="analysis-section"><div class="section-title">Traditional Boston: Pattern Recognition & Mnemonics</div>';
    h += '<div class="step-box"><strong>STEP 1: pH Status</strong><br/>pH = ' + d.pH.toFixed(2) + ' → ' + (acidaemia ? '🔴 ACIDAEMIA' : d.pH > 7.45 ? '🔵 ALKALAEMIA' : '🟢 NORMAL') + '</div>';
    h += '<div class="step-box"><strong>STEP 2: Respiratory Response (Winter\'s Formula)</strong><br/>';
    if (acidaemia) {
        const exp = (1.5 * d.HCO3 + 8 + 2).toFixed(0);
        h += 'Expected pCO2 = 1.5 × HCO3 + 8 ± 2 = ' + exp + ' mmHg<br/>Measured = ' + d.pCO2.toFixed(0) + ' mmHg<br/>';
        if (d.pCO2 < exp - 2) h += '🔵 Appropriate respiratory compensation';
        else if (d.pCO2 > exp + 2) h += '🔴 Concurrent respiratory acidosis';
        else h += '✓ Appropriate';
    } else {
        h += 'pCO2 = ' + d.pCO2.toFixed(0) + ' mmHg (Alkalaemia context)';
    }
    h += '</div>';
    h += '<div class="step-box"><strong>STEP 3–4: Anion Gap</strong><br/>AG = ' + AnGap.toFixed(0) + ' | Corrected = ' + AG_corrected.toFixed(1) + '<br/>' + (AG_corrected > 16 ? '🔴 HIGH (HAGMA)' : '🟢 NORMAL') + '</div>';
    h += '<div class="step-box"><strong>STEP 5: Differential Diagnosis</strong><br/>';
    if (acidaemia && AG_corrected > 16) {
        h += '🔴 <strong>HIGH AG METABOLIC ACIDOSIS – GOLDMARK</strong><br/>';
        h += '• <strong>G</strong>lycols • <strong>O</strong>xoproline • <strong>L</strong>-lactate • <strong>D</strong>-lactate • <strong>M</strong>ethanol • <strong>A</strong>spirin • <strong>R</strong>enal failure • <strong>K</strong>etoacidosis';
    } else if (acidaemia) {
        h += '🔴 <strong>NORMAL AG METABOLIC ACIDOSIS – USEDCARS</strong><br/>';
        h += '• <strong>U</strong>reterosigmoidostomy • <strong>S</strong>aline • <strong>E</strong>ndocrine • <strong>D</strong>iarrhoea • <strong>C</strong>arbonic anhydrase inhibitors • <strong>A</strong>mmonium chloride • <strong>R</strong>TA • <strong>S</strong>pironolactone';
    } else {
        h += '🔵 <strong>ALKALAEMIA</strong>';
    }
    h += '</div>';
    return h;
}

function buildFigge(d, predicted_pH) {
    let h = '<div class="analysis-section"><div class="section-title">Figge-Fencl: Unmeasured Ions</div>';
    h += '<div class="step-box"><strong>Predicted vs Measured pH Comparison</strong><br/>Predicted (Stewart): ' + predicted_pH.toFixed(2) + ' | Measured: ' + d.pH.toFixed(2) + ' | Δ: ' + (d.pH - predicted_pH).toFixed(3) + '<br/>';
    if (Math.abs(d.pH - predicted_pH) > 0.1) {
        h += '⚠️ SIGNIFICANT DIFFERENCE – Unmeasured ions likely present';
    } else {
        h += '✓ Measured ions explain the pH';
    }
    h += '</div></div>';
    return h;
}
