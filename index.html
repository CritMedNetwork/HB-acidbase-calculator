<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iSTAT ABG Master Analyzer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-primary: #0d1117;
            --bg-secondary: #1c2128;
            --bg-tertiary: #262c36;
            --text-primary: #e6edf3;
            --text-secondary: #8b949e;
            --border: #30363d;
            --accent-normal: #58a6ff;
            --accent-warning: #d29922;
            --accent-critical: #f85149;
            --accent-safe: #3fb950;
            --font-display: 'Monaco', 'Courier New', monospace;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg-primary); color: var(--text-primary); padding: 20px; line-height: 1.6; }
        .container { max-width: 1200px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 30px; padding: 20px; border-bottom: 2px solid var(--border); }
        .header h1 { font-size: 1.8rem; margin-bottom: 8px; color: var(--accent-normal); }
        .header p { color: var(--text-secondary); font-size: 0.9rem; }
        .case-selector { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 24px; padding: 20px; background: var(--bg-secondary); border-radius: 8px; }
        .case-btn { padding: 12px 16px; background: var(--bg-tertiary); color: var(--text-primary); border: 2px solid var(--border); border-radius: 6px; cursor: pointer; font-size: 0.9rem; transition: all 0.2s; text-align: left; }
        .case-btn:hover { border-color: var(--accent-normal); background: var(--bg-primary); }
        .case-btn.active { border-color: var(--accent-normal); background: rgba(88, 166, 255, 0.1); }
        .case-name { font-weight: 600; margin-bottom: 4px; }
        .case-desc { font-size: 0.8rem; color: var(--text-secondary); }
        .input-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 24px; padding: 20px; background: var(--bg-secondary); border-radius: 8px; }
        .input-group { display: flex; flex-direction: column; }
        .input-group label { font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 4px; font-weight: 500; }
        .input-group input { padding: 8px 12px; background: var(--bg-tertiary); border: 1px solid var(--border); color: var(--text-primary); border-radius: 4px; font-family: var(--font-display); }
        .input-group input:focus { outline: none; border-color: var(--accent-normal); box-shadow: 0 0 0 2px rgba(88, 166, 255, 0.1); }
        .button-group { display: flex; gap: 12px; margin-bottom: 24px; }
        .btn-analyze { flex: 1; padding: 12px 24px; background: var(--accent-normal); color: var(--bg-primary); border: none; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 1rem; }
        .btn-analyze:hover { background: #4184e4; }
        .tabs { display: flex; gap: 12px; margin-bottom: 24px; border-bottom: 2px solid var(--border); flex-wrap: wrap; }
        .tab-btn { padding: 12px 20px; background: none; border: none; color: var(--text-secondary); cursor: pointer; font-size: 0.95rem; border-bottom: 3px solid transparent; transition: all 0.2s; margin-bottom: -2px; }
        .tab-btn:hover { color: var(--text-primary); }
        .tab-btn.active { color: var(--accent-normal); border-bottom-color: var(--accent-normal); }
        .tab-content { display: none; padding: 20px; background: var(--bg-secondary); border-radius: 8px; }
        .tab-content.active { display: block; }
        .analysis-section { padding: 16px; background: var(--bg-tertiary); border-left: 4px solid var(--accent-normal); border-radius: 6px; margin-bottom: 20px; }
        .section-title { font-weight: 600; font-size: 1rem; margin-bottom: 16px; color: var(--accent-normal); font-family: var(--font-display); }
        .step-flow { display: grid; grid-template-columns: 180px 30px 1fr; gap: 12px; align-items: center; margin-bottom: 0; }
        .step-box { padding: 12px; background: var(--bg-secondary); border: 2px solid var(--border); border-radius: 6px; text-align: center; font-weight: 500; font-size: 0.85rem; min-height: 70px; display: flex; flex-direction: column; justify-content: center; }
        .step-arrow { text-align: center; color: var(--text-secondary); font-size: 1.2rem; }
        .step-interpretation { padding: 12px; background: rgba(94, 234, 212, 0.05); border-radius: 4px; border-left: 3px solid var(--accent-safe); font-size: 0.85rem; min-height: 70px; display: flex; align-items: center; }
        .vertical-connector { text-align: center; color: var(--text-secondary); font-size: 1.5rem; grid-column: 1 / 2; margin: -8px 0; }
        .slider-group { margin: 16px 0; padding: 12px; background: var(--bg-primary); border-radius: 6px; border: 1px solid var(--border); }
        .slider-label { display: flex; justify-content: space-between; font-size: 0.9rem; margin-bottom: 8px; font-weight: 500; }
        .slider-label-value { color: var(--accent-normal); font-family: var(--font-display); }
        input[type="range"] { width: 100%; height: 6px; border-radius: 3px; background: var(--border); outline: none; -webkit-appearance: none; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 18px; height: 18px; border-radius: 50%; background: var(--accent-normal); cursor: pointer; }
        input[type="range"]::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: var(--accent-normal); cursor: pointer; border: none; }
        .driver-summary { padding: 16px; background: rgba(248, 81, 73, 0.05); border-left: 3px solid var(--accent-critical); border-radius: 4px; margin: 20px 0; font-size: 0.9rem; line-height: 1.8; }
        .driver-item { padding: 12px; margin-bottom: 12px; background: var(--bg-secondary); border-left: 3px solid var(--accent-warning); border-radius: 4px; }
        .driver-item.critical { border-left-color: var(--accent-critical); background: rgba(248, 81, 73, 0.05); }
        .correction { padding: 8px; margin-top: 8px; background: var(--bg-primary); border-radius: 4px; font-family: var(--font-display); font-size: 0.85rem; color: var(--accent-normal); }
        .disclaimer { padding: 12px; background: rgba(210, 153, 34, 0.1); border-left: 3px solid var(--accent-warning); margin-bottom: 20px; border-radius: 4px; font-size: 0.85rem; color: var(--text-secondary); }
    </style>
</head>
<body>
<div class="container">
    <div class="disclaimer">
        <strong>⚠️ DISCLAIMER:</strong> Educational tool only. Always correlate with clinical context and verify calculations using current institutional protocols.
    </div>

    <div class="header">
        <h1>iSTAT CG8+ ABG Master Analyzer</h1>
        <p>Hughes & Brain | Stewart | Traditional Boston | Figge-Fencl</p>
        <div style="margin-top: 16px; display: flex; gap: 20px; justify-content: center; font-size: 0.95rem;">
            <a href="index.html" style="color: var(--accent-normal); text-decoration: none; font-weight: 600; border-bottom: 3px solid var(--accent-normal); padding-bottom: 4px;">Calculator</a>
            <a href="about.html" style="color: var(--text-secondary); text-decoration: none; font-weight: 600; padding-bottom: 4px; transition: all 0.2s;" onmouseover="this.style.color='var(--accent-normal)';" onmouseout="this.style.color='var(--text-secondary)';">About & Formulae</a>
            <a href="theory.html" style="color: var(--text-secondary); text-decoration: none; font-weight: 600; padding-bottom: 4px; transition: all 0.2s;" onmouseover="this.style.color='var(--accent-normal)';" onmouseout="this.style.color='var(--text-secondary)';">Acid-Base Theory</a>
        </div>
    </div>

    <div class="case-selector" id="caseOptions">
        <h3 style="grid-column: 1/-1; margin-bottom: 12px; color: var(--text-secondary);">SELECT A TEST CASE</h3>
    </div>

    <div class="input-grid">
        <div class="input-group"><label>pH</label><input type="number" id="pH" step="0.01" min="6" max="8" placeholder="7.35"></div>
        <div class="input-group"><label>pCO2 (mmHg)</label><input type="number" id="pCO2" step="1" min="10" max="100" placeholder="40"></div>
        <div class="input-group"><label>pO2 (mmHg)</label><input type="number" id="pO2" step="1" min="20" max="200" placeholder="90"></div>
        <div class="input-group"><label>HCO3 (mmol/L)</label><input type="number" id="HCO3" step="0.1" min="1" max="60" placeholder="24"></div>
        <div class="input-group"><label>BE (from analyzer)</label><input type="number" id="BE" step="0.1" min="-30" max="30" placeholder="0"></div>
        <div class="input-group"><label>Na (mmol/L)</label><input type="number" id="Na" step="1" min="110" max="160" placeholder="140"></div>
        <div class="input-group"><label>K (mmol/L)</label><input type="number" id="K" step="0.1" min="2" max="8" placeholder="4.0"></div>
        <div class="input-group"><label>Cl (mmol/L)</label><input type="number" id="Cl" step="1" min="80" max="120" placeholder="105"></div>
        <div class="input-group"><label>iCa (mmol/L)</label><input type="number" id="iCa" step="0.01" min="0.5" max="2" placeholder="1.20"></div>
        <div class="input-group"><label>Lactate (mmol/L)</label><input type="number" id="Lactate" step="0.1" min="0" max="20" placeholder="1.5"></div>
        <div class="input-group"><label>Albumin (g/L)</label><input type="number" id="Albumin" step="1" min="20" max="60" placeholder="40"></div>
        <div class="input-group"><label>PO4 (mmol/L)</label><input type="number" id="PO4" step="0.1" min="0.5" max="2.5" placeholder="1.0"></div>
        <div class="input-group"><label>Glucose (mmol/L)</label><input type="number" id="Glucose" step="0.1" min="1" max="40" placeholder="5.0"></div>
        <div class="input-group"><label>Hb (g/L)</label><input type="number" id="Hb" step="5" min="60" max="200" placeholder="140"></div>
        <div class="input-group"><label>Creatinine (μmol/L)</label><input type="number" id="Crea" step="5" min="30" max="300" placeholder="90"></div>
        <div class="input-group"><label>Urea (mmol/L)</label><input type="number" id="Urea" step="0.5" min="1" max="50" placeholder="7"></div>
        <div class="input-group"><label>Osmolality (mOsm/kg)</label><input type="number" id="Osmolality" step="1" min="250" max="350" placeholder="290"></div>
    </div>

    <div class="button-group">
        <button class="btn-analyze" onclick="analyzeCase()">ANALYZE</button>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('hughes')">Hughes & Brain</button>
        <button class="tab-btn" onclick="switchTab('stewart')">Stewart</button>
        <button class="tab-btn" onclick="switchTab('traditional')">Traditional</button>
        <button class="tab-btn" onclick="switchTab('figge')">Figge-Fencl</button>
    </div>

    <div id="hughes" class="tab-content active"><div id="hughesOutput"></div></div>
    <div id="stewart" class="tab-content"><div id="stewartOutput"></div></div>
    <div id="traditional" class="tab-content"><div id="traditionalOutput"></div></div>
    <div id="figge" class="tab-content"><div id="figgeOutput"></div></div>
</div>

<script>
const cases = [
    { name: "Septic Shock", description: "High lactate, low albumin, AKI, K+", data: { pH: 7.28, pCO2: 31, pO2: 87, HCO3: 16, BE: -10, Na: 128, K: 5.8, Cl: 102, iCa: 0.92, Lactate: 8.5, Albumin: 22, PO4: 1.0, Glucose: 8.2, Hb: 115, Crea: 180, Urea: 12, Osmolality: 305 } },
    { name: "Chronic COPD", description: "Respiratory acidosis, compensatory HCO3", data: { pH: 7.32, pCO2: 74, pO2: 54, HCO3: 42, BE: 12, Na: 138, K: 4.5, Cl: 98, iCa: 1.15, Lactate: 1.8, Albumin: 42, PO4: 1.0, Glucose: 5.2, Hb: 180, Crea: 95, Urea: 6, Osmolality: 288 } },
    { name: "DKA", description: "High AG acidosis, hyperglycaemia, K+", data: { pH: 7.18, pCO2: 22, pO2: 102, HCO3: 11, BE: -18, Na: 132, K: 5.8, Cl: 108, iCa: 1.10, Lactate: 2.2, Albumin: 40, PO4: 1.0, Glucose: 28.3, Hb: 160, Crea: 110, Urea: 9, Osmolality: 312 } },
    { name: "Salicylate Overdose", description: "Mixed respiratory alkalosis + metabolic acidosis", data: { pH: 7.42, pCO2: 18, pO2: 110, HCO3: 12, BE: -14, Na: 140, K: 4.2, Cl: 105, iCa: 1.23, Lactate: 1.5, Albumin: 38, PO4: 1.0, Glucose: 7.8, Hb: 145, Crea: 92, Urea: 5, Osmolality: 295 } },
    { name: "Hyperchloremic Acidosis", description: "Normal AG NAGMA, high Cl from diarrhea/RTA", data: { pH: 7.25, pCO2: 35, pO2: 92, HCO3: 15, BE: -8, Na: 140, K: 3.2, Cl: 115, iCa: 1.18, Lactate: 1.2, Albumin: 40, PO4: 0.9, Glucose: 5.5, Hb: 135, Crea: 85, Urea: 7, Osmolality: 292 } }
];

function initCases() {
    const container = document.getElementById('caseOptions');
    cases.forEach((caseObj, idx) => {
        const btn = document.createElement('button');
        btn.className = 'case-btn';
        btn.innerHTML = `<div class="case-name">${caseObj.name}</div><div class="case-desc">${caseObj.description}</div>`;
        btn.onclick = () => loadCase(idx);
        container.appendChild(btn);
    });
}

function loadCase(idx) {
    const caseData = cases[idx];
    Object.keys(caseData.data).forEach(key => {
        document.getElementById(key).value = caseData.data[key];
    });
    document.querySelectorAll('.case-btn').forEach((btn, i) => btn.classList.toggle('active', i === idx));
    analyzeCase();
}

function switchTab(tabName) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    document.getElementById(tabName).classList.add('active');
    event.target.classList.add('active');
}

function analyzeCase() {
    const data = {
        pH: parseFloat(document.getElementById('pH').value) || 7.40,
        pCO2: parseFloat(document.getElementById('pCO2').value) || 40,
        pO2: parseFloat(document.getElementById('pO2').value) || 90,
        HCO3: parseFloat(document.getElementById('HCO3').value) || 24,
        BE: parseFloat(document.getElementById('BE').value) || 0,
        Na: parseFloat(document.getElementById('Na').value) || 140,
        K: parseFloat(document.getElementById('K').value) || 4.0,
        Cl: parseFloat(document.getElementById('Cl').value) || 105,
        iCa: parseFloat(document.getElementById('iCa').value) || 1.20,
        Lactate: parseFloat(document.getElementById('Lactate').value) || 1.5,
        Albumin: parseFloat(document.getElementById('Albumin').value) || 40,
        PO4: parseFloat(document.getElementById('PO4').value) || 1.0,
        Glucose: parseFloat(document.getElementById('Glucose').value) || 5.0,
        Hb: parseFloat(document.getElementById('Hb').value) || 140,
        Crea: parseFloat(document.getElementById('Crea').value) || 90,
        Urea: parseFloat(document.getElementById('Urea').value) || 7,
        Osmolality: parseFloat(document.getElementById('Osmolality').value) || 290
    };

    const BEecf = -0.93 * (24 - data.HCO3) - 16 * (7.40 - data.pH);
    const AnGap = data.Na - (data.Cl + data.HCO3);
    const AG_corrected = AnGap + ((40 - data.Albumin) / 4);
    const acidaemia = data.pH < 7.35;
    const SID = (data.Na + data.K + 2*data.iCa) - (data.Cl + data.Lactate);
    const Atot = (data.Albumin/10) * (0.123 * data.pH - 0.631) + (data.PO4/10) * (0.309 * data.pH - 0.469);
    const predicted_pH = 7.4 + 0.16*(SID-38) + 0.04*(Atot-18) - 0.084*((data.pCO2-40)/7.5);

    document.getElementById('hughesOutput').innerHTML = buildHughesBrain(data, BEecf, AnGap, AG_corrected, acidaemia);
    document.getElementById('stewartOutput').innerHTML = buildStewart(data, SID, Atot, predicted_pH);
    document.getElementById('traditionalOutput').innerHTML = buildTraditional(data, AnGap, AG_corrected, BEecf, acidaemia);
    document.getElementById('figgeOutput').innerHTML = buildFigge(data, predicted_pH);
    setupSliders();
}

function setupSliders() {
    ['na-slider-hb', 'cl-slider-hb', 'k-slider', 'albumin-slider', 'lactate-slider', 'hb-slider'].forEach(id => {
        const slider = document.getElementById(id);
        if (slider) slider.addEventListener('input', (e) => {
            document.getElementById(e.target.getAttribute('data-param')).value = parseFloat(e.target.value);
            analyzeCase();
        });
    });
    ['na-slider', 'cl-slider', 'albumin-slider-stew', 'po4-slider', 'pco2-slider'].forEach(id => {
        const slider = document.getElementById(id);
        if (slider) slider.addEventListener('input', (e) => {
            document.getElementById(e.target.getAttribute('data-param')).value = parseFloat(e.target.value);
            analyzeCase();
        });
    });
}

function buildHughesBrain(d, BE, AG, AGc, acid) {
    let h = '<div class="analysis-section"><div class="section-title">Hughes & Brain: 8-Step Analysis</div>';
    const calc_osm = (2 * d.Na) + (d.Glucose / 18) + (d.Urea / 2.8) + 10;
    h += '<div style="margin-bottom: 24px; display: grid; grid-template-columns: 180px 30px 1fr; gap: 12px; align-items: start;">';
    
    // Step 1
    h += '<div class="step-box"><strong>Step 1<br/>pH</strong><br/>' + d.pH.toFixed(2) + '</div>';
    h += '<div class="step-arrow">→</div>';
    h += '<div class="step-interpretation">' + (acid ? '🔴 ACIDAEMIA' : d.pH > 7.45 ? '🔵 ALKALAEMIA' : '🟢 NORMAL (7.35-7.45)') + '</div>';
    
    // Vertical connector
    h += '<div class="vertical-connector">↓</div><div></div><div></div>';
    
    // Step 2
    h += '<div class="step-box"><strong>Step 2<br/>pCO2</strong><br/>' + d.pCO2.toFixed(0) + ' mmHg</div>';
    h += '<div class="step-arrow">→</div>';
    h += '<div class="step-interpretation">' + (d.pCO2 > 45 ? '↑ HYPOVENTILATION' : d.pCO2 < 35 ? '↓ HYPERVENTILATION' : '✓ Normal (35-45)') + '</div>';
    
    // Vertical connector
    h += '<div class="vertical-connector">↓</div><div></div><div></div>';
    
    // Step 3
    h += '<div class="step-box"><strong>Step 3<br/>BEecf</strong><br/>' + BE.toFixed(1) + ' mEq/L</div>';
    h += '<div class="step-arrow">→</div>';
    h += '<div class="step-interpretation">' + (BE < -3 ? '🔴 ACIDOSIS' : BE > 3 ? '🔵 ALKALOSIS' : '🟢 Normal (-3 to +3)') + '</div>';
    
    // Vertical connector
    h += '<div class="vertical-connector">↓</div><div></div><div></div>';
    
    // Step 4-5
    h += '<div class="step-box"><strong>Steps 4–5<br/>Anion Gap</strong><br/>Raw: ' + AG.toFixed(0) + '<br/>Corr: ' + AGc.toFixed(1) + '</div>';
    h += '<div class="step-arrow">→</div>';
    h += '<div class="step-interpretation">' + (AGc > 16 ? '🔴 HIGH AG<br/>(HAGMA)' : '🟢 NORMAL AG<br/>(0-16)') + '</div>';
    
    // Vertical connector
    h += '<div class="vertical-connector">↓</div><div></div><div></div>';
    
    // Step 6
    h += '<div class="step-box"><strong>Step 6<br/>Lactate</strong><br/>' + d.Lactate.toFixed(1) + ' mmol/L</div>';
    h += '<div class="step-arrow">→</div>';
    h += '<div class="step-interpretation">' + (d.Lactate > 4 ? '🔴 SEVERE (>4)' : d.Lactate > 2.2 ? '🟡 ELEVATED' : '🟢 NORMAL (0.5-2.2)') + '</div>';
    
    // Vertical connector
    h += '<div class="vertical-connector">↓</div><div></div><div></div>';
    
    // Step 7 - Electrolytes with acid-base context
    const corrected_Cl = d.Cl * (140 / d.Na);
    h += '<div class="step-box"><strong>Step 7<br/>Electrolytes</strong><br/>Na ' + d.Na.toFixed(0) + ' | Cl ' + d.Cl.toFixed(0) + ' | Cl(corr) ' + corrected_Cl.toFixed(1) + '<br/>K ' + d.K.toFixed(1) + '</div>';
    h += '<div class="step-arrow">→</div>';
    
    // Build detailed interpretation with acid-base context
    let elec_status = '';
    let elec_details = '';
    
    // Na interpretation
    if (d.Na < 135) {
        elec_status += '🔴 Na LOW | ';
        elec_details += '• <strong>Na ' + d.Na.toFixed(0) + ' (LOW):</strong> Reduces SID → ACIDIFYING effect<br/>';
    } else if (d.Na > 145) {
        elec_status += '🔵 Na HIGH | ';
        elec_details += '• <strong>Na ' + d.Na.toFixed(0) + ' (HIGH):</strong> Increases SID → ALKALINISING effect<br/>';
    }
    
    // Cl interpretation with corrected Cl context
    if (d.Cl > 110 || corrected_Cl > 110) {
        elec_status += '🔴 Cl HIGH | ';
        if (corrected_Cl > d.Cl + 5) {
            elec_details += '• <strong>Corrected Cl ' + corrected_Cl.toFixed(1) + ' (measured ' + d.Cl.toFixed(0) + '):</strong> Reveals RELATIVE HYPERCHLORAEMIA in context of Na ' + d.Na.toFixed(0) + ' → Reduces SID → ACIDIFYING<br/>';
        } else {
            elec_details += '• <strong>Cl ' + d.Cl.toFixed(0) + ' (HIGH):</strong> Reduces SID → ACIDIFYING effect<br/>';
        }
    } else if (d.Cl < 95) {
        elec_status += '🔵 Cl low | ';
        elec_details += '• <strong>Cl ' + d.Cl.toFixed(0) + ' (LOW):</strong> Increases SID → ALKALINISING effect<br/>';
    }
    
    // K interpretation with acid-base context
    if (d.pH < 7.35) {
        // Acidaemia context
        if (d.K < 3.5) {
            elec_status += '🔴 K dangerously LOW | ';
            elec_details += '• <strong>K ' + d.K.toFixed(1) + ' (PARADOXICALLY LOW in acidaemia):</strong> Indicates SEVERE TOTAL-BODY K DEPLETION. Will drop further as pH corrects. Urgent replacement needed (KPO4 preferred if concurrent Cl excess)<br/>';
        } else if (d.K > 5.5) {
            elec_status += '🟡 K HIGH | ';
            elec_details += '• <strong>K ' + d.K.toFixed(1) + ' (HIGH in acidaemia):</strong> Expected (H+ shifts into cells → K+ shifts out). Will DROP significantly as pH corrects. Monitor closely during bicarb infusion<br/>';
        }
    } else if (d.pH > 7.45) {
        // Alkalaemia context
        if (d.K < 3.5) {
            elec_status += '🔴 K dangerously LOW | ';
            elec_details += '• <strong>K ' + d.K.toFixed(1) + ' (CRITICAL in alkalaemia):</strong> Extreme arrhythmia risk. H+ has shifted out of cells → K+ has shifted out of serum (maximal depletion). URGENT K replacement<br/>';
        } else if (d.K > 5.5) {
            elec_status += '🟡 K HIGH | ';
            elec_details += '• <strong>K ' + d.K.toFixed(1) + ' (UNUSUAL in alkalaemia):</strong> Suggests concurrent renal disease, rhabdo, or other major K driver<br/>';
        }
    } else {
        // Normal pH context
        if (d.K > 5.5 || d.K < 3.5) elec_status += '⚠️ K abnormal | ';
    }
    
    if (!elec_status) elec_status = '✓ Normal';
    h += '<div class="step-interpretation">' + elec_status + '</div>';
    if (elec_details) {

            const bicarb_initial_mod = Math.round(bicarb_mL / 2);
            h += '<div class="driver-item">' + '🟡 <strong>METABOLIC ACIDOSIS (BEecf ' + BE.toFixed(1) + ')</strong>';
            h += '<div class="correction">• <strong>NaHCO3 8.4% target:</strong> ' + bicarb_mL + ' mL total<br/>';
            h += '• <strong>INITIAL DOSE (HALF-CORRECTION):</strong> ' + bicarb_initial_mod + ' mL IV over 15-30 min<br/>';
            h += '• <strong>Recheck ABG 30 min after</strong>; reassess before giving remainder<br/>';
            h += '• Address underlying cause (lactate, DKA, renal failure, etc.)<br/>';
            h += '• Monitor: K will drop as pH corrects; watch for volume overload</div></div>';
        } else {
            h += '<div class="driver-item">' + '🟡 <strong>METABOLIC ACIDOSIS (BEecf ' + BE.toFixed(1) + ')</strong>';
            h += '<div class="correction">• Address underlying cause preferentially<br/>';
            h += '• If pH >7.20: Focus on cause, not pH correction<br/>';
            h += '• Recheck ABG after intervention</div></div>';
        }
    }
    
    // Metabolic Alkalosis section
    if (d.HCO3 > 26 && d.pH > 7.45) {
        const target_pCO2_low = 35;
        const target_pCO2_high = 40;
        const exp_pCO2_alk = 40 + (0.7 * (d.HCO3 - 24)); // Winter's formula approximation for alkalosis
        const mv_increase_to_exp = Math.round(((exp_pCO2_alk / 40) - 1) * 100);
        
        h += '<div class="driver-item">🔵 <strong>METABOLIC ALKALOSIS (HCO3 ' + d.HCO3.toFixed(0) + ' mmol/L, pH ' + d.pH.toFixed(2) + ')</strong>';
        h += '<div class="correction">• <strong>Expected respiratory compensation:</strong> pCO2 should rise to ~' + Math.round(exp_pCO2_alk) + ' mmHg to partially compensate<br/>';
        h += '• <strong>Current pCO2:</strong> ' + d.pCO2.toFixed(0) + ' mmHg | <strong>Expected:</strong> ~' + Math.round(exp_pCO2_alk) + ' mmHg';
        if (d.pCO2 < exp_pCO2_alk - 5) {
            h += ' → 🔴 <strong>INSUFFICIENT respiratory compensation</strong> (pCO2 too low) – pH rising unchecked';
        } else if (d.pCO2 > exp_pCO2_alk + 5) {
            h += ' → 🟡 <strong>EXCESSIVE respiratory compensation</strong> (pCO2 too high) – but still better than worsening alkalosis';
        } else {
            h += ' → ✓ <strong>Appropriate respiratory compensation</strong>';
        }
        h += '<br/>';
        h += '• <strong>If spontaneously breathing:</strong> Hypoventilation is compensatory—allow it. Do NOT force hyperventilation. The patient\'s respiratory drive increases naturally in alkalosis.<br/>';
        h += '• <strong>If mechanically ventilated:</strong> CAUTION: Do not over-ventilate. Reduce RR or tidal volume as needed to allow pCO2 to rise toward expected level, or risk worsening alkalaemia.<br/>';
        h += '• <strong>Primary management:</strong> Treat underlying cause (K replacement if hypokalemic, stop diuretics, volume repletion, etc.)<br/>';
        h += '• Monitor: Recheck ABG q1–2h; watch pCO2 rise as compensation activates and alkalosis resolves</div></div>';
    } else if (d.HCO3 > 26 && d.pH <= 7.45) {
        h += '<div class="driver-item">🟡 <strong>METABOLIC ALKALOSIS (HCO3 ' + d.HCO3.toFixed(0) + ' mmol/L)</strong>';
        h += '<div class="correction">• pH is currently normal/low-normal, but HCO3 is elevated—risk of alkalaemia if process continues<br/>';
        h += '• <strong>Address underlying cause:</strong> K depletion, GI losses, volume depletion, diuretics<br/>';
        h += '• If K low: KCl replacement will help suppress further HCO3 rise<br/>';
        h += '• Monitor: K, HCO3, pH trends</div></div>';
    }
    
    if (d.pCO2 < 30 && d.pH < 7.35) {
        // COMPENSATORY hyperventilation: pCO2 LOW in context of LOW pH
        const target_pCO2_low = 35;
        const target_pCO2_high = 40;
        const mv_adjust_to_35 = Math.round(((d.pCO2 / target_pCO2_low) - 1) * 100);
        const mv_adjust_to_40 = Math.round(((d.pCO2 / target_pCO2_high) - 1) * 100);
        
        h += '<div class="driver-item">🟡 <strong>COMPENSATORY HYPERVENTILATION (pCO2 ' + d.pCO2.toFixed(0) + ' mmHg, pH ' + d.pH.toFixed(2) + ')</strong>';
        h += '<div class="correction"><strong>This is APPROPRIATE respiratory compensation for metabolic acidaemia—DO NOT aggressively correct it.</strong><br/>';
        h += '• <strong>Mechanism:</strong> Metabolic acidaemia → respiratory drive increases → pCO2 falls → ALKALINISING effect OFFSETS metabolic acidaemia<br/>';
        h += '• <strong>EXPECTATION as acidosis improves:</strong> Minute ventilation will DECREASE by ~' + Math.abs(mv_adjust_to_35) + '–' + Math.abs(mv_adjust_to_40) + '% as pH normalizes<br/>';
        h += '<br/><strong>IF SPONTANEOUSLY BREATHING:</strong><br/>';
        h += '• <strong>Do NOT make any adjustments to ventilation.</strong> The patient\'s respiratory drive will naturally decrease as the metabolic acidosis is treated<br/>';
        h += '• <strong>Just treat the underlying cause:</strong> Address lactate, DKA, Cl excess, renal failure, etc.<br/>';
        h += '• Monitor: Recheck ABG q1–2h; expect pCO2 to rise gradually as pH corrects<br/>';
        h += '<br/><strong>IF MECHANICALLY VENTILATED:</strong><br/>';
        h += '• <strong>You MUST reduce minute ventilation gradually</strong> as the metabolic acidosis is treated, or risk iatrogenic respiratory alkalosis<br/>';
        h += '• <strong>Reduction target:</strong> Decrease RR or tidal volume progressively to achieve pCO2 rise of ~' + Math.abs(mv_adjust_to_35) + '–' + Math.abs(mv_adjust_to_40) + '% as pH improves toward 7.35<br/>';
        h += '• <strong>Timing:</strong> Reduce gradually with each ABG (q1–2h); do not make large changes in one step<br/>';
        h += '• <strong>Rationale:</strong> If you keep MV high while treating the acidosis, pCO2 will stay low → pH will overshoot into alkalosis</div></div>';
    } else if (d.pCO2 < 30 && d.pH >= 7.35) {
        // PRIMARY HYPERVENTILATION: pCO2 LOW in context of NORMAL/HIGH pH
        const mv_decrease = Math.round(((40 - d.pCO2) / 40) * 100);
        h += '<div class="driver-item">🔴 <strong>PRIMARY HYPERVENTILATION (pCO2 ' + d.pCO2.toFixed(0) + ' mmHg, pH ' + d.pH.toFixed(2) + ') – CREATING RESPIRATORY ALKALOSIS</strong>';
        h += '<div class="correction"><strong>This is INAPPROPRIATE hyperventilation—the PRIMARY pathology is excessive ventilation, NOT metabolic disorder.</strong><br/>';
        h += '• <strong>Mechanism:</strong> Hyperventilation → pCO2 falls → pH rises → RESPIRATORY ALKALOSIS<br/>';
        h += '• <strong>Causes:</strong> Anxiety, pain, fever, sepsis, mechanical ventilation settings too aggressive, CNS stimulation<br/>';
        h += '• <strong>CORRECTION NEEDED:</strong> Minute ventilation must DECREASE by ~' + mv_decrease + '%<br/>';
        h += '<br/><strong>IF SPONTANEOUSLY BREATHING:</strong><br/>';
        h += '• <strong>Address the DRIVER:</strong> Reassurance for anxiety, analgesia for pain, antipyretics/cooling for fever, treat sepsis<br/>';
        h += '• <strong>Expect gradual correction:</strong> As anxiety/pain/fever resolves, respiratory rate will naturally decrease<br/>';
        h += '• Monitor: Recheck ABG after interventions; respiratory rate and pCO2 should trend toward normal<br/>';
        h += '<br/><strong>IF MECHANICALLY VENTILATED:</strong><br/>';
        h += '• <strong>You MUST reduce minute ventilation</strong> (RR or tidal volume) to bring pCO2 toward 35–40 mmHg<br/>';
        h += '• <strong>Reduction target:</strong> Decrease by ~' + mv_decrease + '% gradually toward pCO2 35–40<br/>';
        h += '• <strong>Timing:</strong> Adjust RR/tidal volume incrementally with each ABG (q1–2h); recheck ABG 30 min after changes<br/>';
        h += '• Check: Sedation level, mechanical causes (PEEP too high?), monitor for pain</div></div>';
    } else if (d.pCO2 > 55) {
        const mv_increase = Math.round(((d.pCO2 - 40) / 40) * 100);
        const is_compensatory_hypovent = d.pH > 7.45;
        
        if (is_compensatory_hypovent) {
            h += '<div class="driver-item">🟡 <strong>COMPENSATORY HYPOVENTILATION (pCO2 ' + d.pCO2.toFixed(0) + ' mmHg, pH ' + d.pH.toFixed(2) + ')</strong>';
            h += '<div class="correction"><strong>This is APPROPRIATE respiratory compensation for metabolic alkalaemia—DO NOT aggressively correct it.</strong><br/>';
            h += '• <strong>Mechanism:</strong> Metabolic alkalaemia → respiratory drive decreases → pCO2 rises → ACIDIFYING effect OFFSETS metabolic alkalaemia<br/>';
            h += '• <strong>EXPECTATION as alkalosis improves:</strong> Minute ventilation will naturally INCREASE as pH normalizes, but this happens passively<br/>';
            h += '<br/><strong>IF SPONTANEOUSLY BREATHING:</strong><br/>';
            h += '• <strong>Do NOT make any adjustments to ventilation.</strong> The patient\'s respiratory drive will naturally increase as the metabolic alkalosis is treated<br/>';
            h += '• <strong>Just treat the underlying cause:</strong> K replacement (if hypokalaemic), address GI losses, volume repletion, stop diuretics<br/>';
            h += '• Monitor: Recheck ABG q1–2h; expect pCO2 to fall gradually as pH corrects<br/>';
            h += '<br/><strong>IF MECHANICALLY VENTILATED:</strong><br/>';
            h += '• <strong>You MUST NOT over-ventilate.</strong> As the metabolic alkalosis is treated, pCO2 will start to fall naturally<br/>';
            h += '• <strong>Increase minute ventilation only if pCO2 remains elevated after alkalosis is treated.</strong><br/>';
            h += '• <strong>Rationale:</strong> If you increase RR/tidal volume now, you\'ll increase pCO2 further, worsening alkalaemia. Let the metabolic correction drive pCO2 down<br/>';
            h += '• Monitor: Recheck ABG q1–2h; watch pCO2 trend as K/alkalosis are corrected</div></div>';
        } else {
            h += '<div class="driver-item">🔴 <strong>PRIMARY HYPOVENTILATION (pCO2 ' + d.pCO2.toFixed(0) + ' mmHg, pH ' + d.pH.toFixed(2) + ') – CREATING RESPIRATORY ACIDOSIS</strong>';
            h += '<div class="correction"><strong>This is INAPPROPRIATE hypoventilation—the PRIMARY pathology is inadequate ventilation.</strong><br/>';
            h += '• <strong>Mechanism:</strong> Inadequate ventilation → pCO2 rises → pH falls → RESPIRATORY ACIDOSIS<br/>';
            h += '• <strong>Causes:</strong> Respiratory depression (sedation, opioids, CNS disease), pain, weak respiratory muscles, mechanical issues (PEEP, obstruction, compliance problems)<br/>';
            h += '• <strong>CORRECTION NEEDED:</strong> Minute ventilation must INCREASE by ~' + mv_increase + '%<br/>';
            h += '<br/><strong>IF SPONTANEOUSLY BREATHING:</strong><br/>';
            h += '• <strong>Address the DRIVER:</strong> Reduce sedation/opioids, treat pain, assess for respiratory muscle weakness, treat underlying respiratory disease<br/>';
            h += '• <strong>Encourage deep breathing:</strong> Prompt patient to breathe deeper; coughing/incentive spirometry<br/>';
            h += '• Monitor: Recheck ABG after interventions; respiratory rate and pCO2 should trend toward normal<br/>';
            h += '<br/><strong>IF MECHANICALLY VENTILATED:</strong><br/>';
            h += '• <strong>You MUST increase minute ventilation</strong> (RR or tidal volume) to bring pCO2 toward 35–45 mmHg<br/>';
            h += '• <strong>Increase target:</strong> Increase by ~' + mv_increase + '% gradually toward pCO2 35–45<br/>';
            h += '• <strong>Timing:</strong> Adjust RR/tidal volume incrementally with each ABG (q1–2h); recheck ABG 30 min after changes<br/>';
            h += '• Check: Sedation level, PEEP, compliance, circuit patency, ventilator synchrony, pain control<br/>';
            h += '• <strong>Rationale:</strong> Under-ventilation in a mechanically ventilated patient is a correctable problem—fix the settings</div></div>';
        }
    }
    
    if (d.Na < 130) {
        const na_deficit = (140 - d.Na) * 0.5 * 80;
        const saline_3pct_mL = Math.round(na_deficit / 0.51);
        const saline_234pct_mL = Math.round(na_deficit / 4);
        h += '<div class="driver-item critical">🔴 <strong>Severe Hyponatraemia (Na ' + d.Na + ') – SEIZURE RISK</strong>';
        h += '<div class="correction">• <strong>3% NaCl:</strong> ' + saline_3pct_mL + ' mL IV (250 mL bag preferred)<br/>';
        h += '• <strong>OR 23.4% NaCl:</strong> ' + saline_234pct_mL + ' mL IV (10 mL ampoule)<br/>';
        h += '• Target: Raise Na by 10-12 mmol/L acutely, then 8 mmol/L daily<br/>';
        h += '• Risk of osmotic demyelination if corrected too fast</div></div>';
    } else if (d.Na < 135) {
        const na_deficit = (140 - d.Na) * 0.6 * 80;
        const saline_3pct_mL = Math.round(na_deficit / 0.51);
        h += '<div class="driver-item">🟡 <strong>Hyponatraemia (Na ' + d.Na + ') – OSMOLALITY-GUIDED APPROACH</strong>';
        h += '<div class="correction"><strong>Step 1: Measure serum osmolality</strong><br/>';
        h += '• <strong>If Osmolality >300 (Hyper-osmotic):</strong> Pseudohyponatraemia (hyperglycaemia, hyperproteinaemia)<br/>';
        h += '  → Treat hyperglycaemia; repeat Na<br/>';
        h += '• <strong>If Osmolality 280–300 (Iso-osmotic):</strong> Pseudohyponatraemia (lab artifact)<br/>';
        h += '  → Repeat Na, check lipids<br/>';
        h += '• <strong>If Osmolality <280 (Hypo-osmotic): MEASURE URINE OSMOLALITY</strong><br/>';
        h += '  <strong>If Urine Osm >100:</strong> SIADH, heart failure, cirrhosis, nephrotic → Fluid restrict 500–800 mL/day<br/>';
        h += '  <strong>If Urine Osm <100:</strong> Primary polydipsia or adrenal insufficiency → Fluid restrict<br/>';
        h += '• <strong>Correct slowly:</strong> 8–10 mmol/L daily (risk of osmotic demyelination)<br/>';
        h += '• <strong>If symptomatic (seizures):</strong> 3% NaCl ' + saline_3pct_mL + ' mL IV over 30 min</div></div>';
    }
    
    const corrected_Cl_standalone = d.Cl * (140 / d.Na);
    if (d.Cl > 110 || corrected_Cl_standalone > 110) {
        const cl_alert = d.Cl > 110 ? 'Cl ' + d.Cl.toFixed(0) : 'Corrected Cl ' + corrected_Cl_standalone.toFixed(1) + ' (measured ' + d.Cl.toFixed(0) + ')';
        h += '<div class="driver-item critical">🔴 <strong>Hyperchloraemia (' + cl_alert + ' mmol/L) – STRONG ION ABNORMALITY</strong>';
        h += '<div class="correction">• <strong>Primary problem:</strong> High Cl is reducing SID → causes NAGMA (normal AG acidosis)<br/>';
        h += '• <strong>See Metabolic Acidosis section above</strong> for SID-based correction strategy (NaHCO3 volume, K targets)<br/>';
        h += '• <strong>Fluid strategy:</strong> Switch to balanced fluids (Hartmann\'s, Plasmalyte) to gradually dilute Cl excess<br/>';
        h += '• Monitor: Cl trends, acid-base status after corrections</div></div>';
    }
    
    h += '</div>';
    
    // SLIDERS SECTION
    h += '<div style="margin-top: 20px; padding: 12px; background: var(--bg-tertiary); border-radius: 6px; border-top: 2px solid var(--accent-normal);"><strong style="display: block; margin-bottom: 16px; color: var(--accent-normal);">INTERACTIVE DRIVERS: Adjust sliders to explore scenarios</strong>';
    h += '<div class="slider-group"><div class="slider-label"><span>Na</span><span class="slider-label-value">' + d.Na.toFixed(0) + ' mmol/L</span></div><input type="range" id="na-slider-hb" min="110" max="160" step="1" value="' + d.Na + '" data-param="Na"></div>';
    h += '<div class="slider-group"><div class="slider-label"><span>Cl</span><span class="slider-label-value">' + d.Cl.toFixed(0) + ' mmol/L</span></div><input type="range" id="cl-slider-hb" min="80" max="120" step="1" value="' + d.Cl + '" data-param="Cl"></div>';
    h += '<div class="slider-group"><div class="slider-label"><span>K (Potassium)</span><span class="slider-label-value">' + d.K.toFixed(1) + ' mmol/L</span></div><input type="range" id="k-slider" min="2" max="8" step="0.1" value="' + d.K + '" data-param="K"></div>';
    h += '<div class="slider-group"><div class="slider-label"><span>Albumin</span><span class="slider-label-value">' + d.Albumin.toFixed(0) + ' g/L</span></div><input type="range" id="albumin-slider" min="20" max="60" step="1" value="' + d.Albumin + '" data-param="Albumin"></div>';
    h += '<div class="slider-group"><div class="slider-label"><span>Lactate</span><span class="slider-label-value">' + d.Lactate.toFixed(1) + ' mmol/L</span></div><input type="range" id="lactate-slider" min="0.5" max="20" step="0.1" value="' + d.Lactate + '" data-param="Lactate"></div>';
    h += '<div class="slider-group"><div class="slider-label"><span>Haemoglobin</span><span class="slider-label-value">' + d.Hb.toFixed(0) + ' g/L</span></div><input type="range" id="hb-slider" min="60" max="200" step="5" value="' + d.Hb + '" data-param="Hb"></div>';
    h += '</div>';
    
    h += '</div>';
    return h;
}

function buildStewart(d, SID, Atot, pred_pH) {
    let h = '<div class="analysis-section"><div class="section-title">Stewart: Three Independent Variables</div>';
    h += '<div style="margin-bottom: 24px; display: grid; grid-template-columns: 180px 30px 1fr; gap: 12px; align-items: start;">';
    
    h += '<div class="step-box"><strong>Variable 1<br/>SID</strong><br/>' + SID.toFixed(1) + ' mEq/L</div>';
    h += '<div class="step-arrow">→</div>';
    h += '<div class="step-interpretation">' + (SID < 38 ? '🔴 LOW<br/>(Acidifying)' : SID > 42 ? '🔵 HIGH<br/>(Alkalinizing)' : '🟢 NORMAL<br/>(38-42)') + '</div>';
    
    h += '<div class="vertical-connector">↓</div><div></div><div></div>';
    
    h += '<div class="step-box"><strong>Variable 2<br/>Atot</strong><br/>' + Atot.toFixed(1) + ' mEq/L</div>';
    h += '<div class="step-arrow">→</div>';
    h += '<div class="step-interpretation">' + (Atot < 18 ? '🔴 LOW<br/>(Acidifying)' : Atot > 18 ? '🔵 HIGH<br/>(Alkalinizing)' : '🟢 NORMAL<br/>(~18)') + '</div>';
    
    h += '<div class="vertical-connector">↓</div><div></div><div></div>';
    
    h += '<div class="step-box"><strong>Variable 3<br/>pCO2</strong><br/>' + d.pCO2.toFixed(0) + ' mmHg</div>';
    h += '<div class="step-arrow">→</div>';
    h += '<div class="step-interpretation">' + (d.pCO2 < 35 ? '↓ Low<br/>(Alkalinizing)' : d.pCO2 > 45 ? '↑ High<br/>(Acidifying)' : '✓ Normal<br/>(35-45)') + '</div>';
    
    h += '<div class="vertical-connector">↓</div><div></div><div></div>';
    
    h += '<div class="step-box"><strong>PREDICTED<br/>pH</strong><br/>Stewart Eqn</div>';
    h += '<div class="step-arrow">→</div>';
    h += '<div class="step-interpretation"><strong style="color: var(--accent-normal); font-size: 1rem;">pH = ' + pred_pH.toFixed(2) + '</strong><br/>Measured: ' + d.pH.toFixed(2) + '<br/>Δ: ' + (d.pH - pred_pH).toFixed(3) + '</div>';
    
    h += '</div>';
    
    // DRIVER SUMMARY
    h += '<div class="driver-summary"><strong style="color: var(--accent-critical); font-size: 1.1rem;">STEWART DRIVER ANALYSIS (80 kg patient)</strong>';
    h += '<div style="padding: 12px; margin-bottom: 16px; background: rgba(88, 166, 255, 0.1); border-left: 3px solid var(--accent-normal); border-radius: 4px; font-size: 0.9rem;"><strong style="color: var(--accent-normal);">⚡ CLINICAL INSIGHT:</strong> SID management is far more effective than Atot correction. Albumin is very hard to increment meaningfully even with high doses, so focus on correcting strong ions (Na, K, Cl, Lactate) to improve pH. Atot is a contributing factor but not your main lever. <strong>In practice: Your two clinically relevant Stewart levers are SID correction and ventilation adjustment.</strong><br/><br/><strong style="margin-top: 8px; display: block;">CORRECTED CHLORIDE (Cl × 140/Na):</strong> If measured Cl looks borderline (105–110) but corrected Cl >110, this reveals hidden hyperchloremic pattern in context of low Na. Always interpret Cl relative to Na using corrected Cl.<br/><br/><strong style="margin-top: 8px; display: block;">⚠️ HALF-CORRECTION RULE:</strong> All NaHCO3 dosing shown as TARGET (total needed). <strong>Give HALF initially</strong>, recheck ABG in 30 min, then reassess. This avoids hypernatraemia, volume overload, K crash, and overcorrection to alkalaemia. Titrate, don\'t dump.</div>';
    
    // Calculate SID target and Na requirement
    const current_SID_stew = (d.Na + d.K + 2*d.iCa) - (d.Cl + d.Lactate);
    const target_pH_stew = 7.35;
    const current_Atot_stew = (d.Albumin/10) * (0.123 * d.pH - 0.631) + (d.PO4/10) * (0.309 * d.pH - 0.469);
    const required_SID_stew = 38 + ((target_pH_stew - 7.4 - 0.04*(current_Atot_stew-18) + 0.084*((d.pCO2-40)/7.5)) / 0.16);
    const required_Na_stew = required_SID_stew + (d.Cl + d.Lactate) - (d.K + 2*d.iCa);
    const na_deficit_stew = required_Na_stew - d.Na;
    const bicarb_mL_stew = Math.round(na_deficit_stew * 0.6 * 80 / 1);
    
    h += '<div style="padding: 12px; margin-bottom: 16px; background: rgba(58, 182, 182, 0.1); border-left: 3px solid var(--accent-safe); border-radius: 4px; font-size: 0.9rem;"><strong style="color: var(--accent-safe);">SID TARGET & CORRECTION STRATEGY (Target pH 7.35):</strong><br/>';
    h += '• <strong>Current SID:</strong> ' + current_SID_stew.toFixed(1) + ' | <strong>Required SID:</strong> ' + required_SID_stew.toFixed(1) + ' | <strong>Deficit:</strong> ' + (required_SID_stew - current_SID_stew).toFixed(1) + ' mEq/L<br/>';
    h += '• <strong>Current Na:</strong> ' + d.Na.toFixed(0) + ' | <strong>Required Na:</strong> ' + required_Na_stew.toFixed(0) + ' | <strong>Deficit:</strong> ' + na_deficit_stew.toFixed(1) + ' mmol/L<br/>';
    if (bicarb_mL_stew > 0) {
        const bicarb_initial_stew = Math.round(bicarb_mL_stew / 2);
        h += '• <strong>NaHCO3 8.4% target:</strong> ' + bicarb_mL_stew + ' mL total (SID deficit ' + (required_SID_stew - current_SID_stew).toFixed(1) + ' mEq/L)<br/>';
        h += '• <strong>INITIAL DOSE (HALF-CORRECTION):</strong> ' + bicarb_initial_stew + ' mL IV over 20-30 min<br/>';
        h += '• <strong>Recheck ABG in 30 min</strong>; reassess pH response before giving remainder<br/>';
        h += '• Parallel: Use balanced fluids (Hartmann\'s/Plasmalyte) for remaining SID correction<br/>';
        h += '• Safety: Monitor Na (hypernatraemia risk), K (drops as pH corrects), volume status<br/>';
        h += '• <strong>Na already adequate or high:</strong> Focus on K/Cl/Lactate correction instead<br/>';
    } else {
        h += '• <strong>Na is at target:</strong> SID correction achieved via other ions<br/>';
    }
    h += '• <strong>Alternative approach:</strong> Hartmann\'s/Plasmalyte ' + Math.round(((required_SID_stew - current_SID_stew) * 0.6 * 80) / 500) * 500 + ' mL to gradually restore SID</div>';
    
    if (SID < 35) {
        const vol_needed = (38 - SID) * 0.6 * 80;
        h += '<div class="driver-item critical">🔴 <strong>SID Critically Low (' + SID.toFixed(1) + ') – SEVERE ACIDOSIS RISK</strong>';
        h += '<div class="correction"><strong>Correct by increasing SID:</strong><br/>';
        h += '• <strong>Option 1 – Fluids:</strong> Hartmann\'s or Plasmalyte ~' + Math.round(vol_needed / 500) * 500 + ' mL IV (balanced = ↑SID)<br/>';
        h += '• <strong>Option 2 – Limit Cl-related Acidaemia:</strong> Discontinue 0.9% NaCl (hyperchloraemic)<br/>';
        if (d.K < 4.0) {
            h += '• <strong>Option 3 – K replacement:</strong> KCl 10-20 mmol in 100 mL over 30-60 min (SID-neutral: K+ and Cl− cancel)<br/>';
        }
        h += '• <strong>Option 4 – Add Na:</strong> NaHCO3 8.4%: ~50 mL IV OR hypertonic saline 3% ' + Math.round((140 - d.Na) * 0.5 * 80 / 0.51) + ' mL<br/>';
        h += '• Assess: Which strong ion is deficient? (Na loss, K loss, Cl excess?)</div></div>';
    } else if (SID < 38) {
        h += '<div class="driver-item">🟡 <strong>SID Low (' + SID.toFixed(1) + ') – Acidifying Effect</strong>';
        h += '<div class="correction"><strong>Incremental SID correction:</strong><br/>';
        h += '• <strong>First line:</strong> Use Hartmann\'s or Plasmalyte over 0.9% NaCl<br/>';
        if (d.K < 4.5) {
            h += '• <strong>If K low:</strong> KCl 10 mmol in 100 mL IV<br/>';
        }
        if (d.Na < 140) {
            h += '• <strong>If Na low:</strong> Hypertonic saline or NaHCO3<br/>';
        }
        h += '• Monitor SID response after interventions</div></div>';
    } else if (SID > 42) {
        h += '<div class="driver-item">🔵 <strong>SID High (' + SID.toFixed(1) + ') – Alkalinizing Effect</strong>';
        h += '<div class="correction">• Associated with contraction alkalosis (saline loss, vomiting)<br/>';
        h += '• OR unmeasured cation excess<br/>';
        h += '• <strong>Management:</strong> Fluid resuscitation with 0.9% NaCl, address GI losses<br/>';
        h += '• Address underlying cause (diuretics? NG suction?)</div></div>';
    }
    
    if (d.Albumin < 35) {
        h += '<div class="driver-item">🟡 <strong>Low Atot from Hypoalbuminaemia (' + d.Albumin.toFixed(0) + ' g/L)</strong>';
        h += '<div class="correction">• <strong>Albumin replacement:</strong> 5% ' + Math.round((40 - d.Albumin) * 0.4) + ' mL IV<br/>';
        h += '• Hypoalbuminaemia → low unmeasured anions → acidifying effect<br/>';
        h += '• Optimize nutrition & liver function</div></div>';
    }
    
    if (d.pCO2 < 30) {
        const mv_decrease = Math.round(((40 - d.pCO2) / 40) * 100);
        const is_compensatory_hypvent = d.pH < 7.35;
        
        if (is_compensatory_hypvent) {
            h += '<div class="driver-item">🟡 <strong>COMPENSATORY HYPERVENTILATION (pCO2 ' + d.pCO2.toFixed(0) + ' mmHg, pH ' + d.pH.toFixed(2) + ')</strong>';
            h += '<div class="correction"><strong>This is APPROPRIATE respiratory compensation for metabolic acidaemia—DO NOT reduce ventilation.</strong><br/>';
            h += '• <strong>EXPECTATION as acidosis improves:</strong> Minute ventilation will DECREASE by ~' + mv_decrease + '% as pH normalizes<br/>';
            h += '<br/><strong>IF SPONTANEOUSLY BREATHING:</strong><br/>';
            h += '• <strong>Do NOT make any adjustments.</strong> The patient\'s respiratory drive will naturally decrease as metabolic acidosis is treated<br/>';
            h += '• <strong>Treat the cause:</strong> Lactate, DKA, renal failure, Cl excess<br/>';
            h += '• Monitor: Recheck ABG q1–2h; expect pCO2 to rise as pH corrects<br/>';
            h += '<br/><strong>IF MECHANICALLY VENTILATED:</strong><br/>';
            h += '• <strong>You MUST reduce minute ventilation gradually</strong> as acidosis is treated, or risk respiratory alkalosis<br/>';
            h += '• <strong>Reduction target:</strong> Decrease RR/tidal volume to achieve pCO2 rise of ~' + mv_decrease + '% as pH improves<br/>';
            h += '• <strong>Timing:</strong> Adjust gradually with ABG (q1–2h); do NOT make large changes at once</div></div>';
        } else {
            h += '<div class="driver-item">🔴 <strong>PRIMARY HYPERVENTILATION (pCO2 ' + d.pCO2.toFixed(0) + ' mmHg, pH ' + d.pH.toFixed(2) + ') – CREATING RESPIRATORY ALKALOSIS</strong>';
            h += '<div class="correction"><strong>This is INAPPROPRIATE hyperventilation—the PRIMARY pathology is excessive ventilation.</strong><br/>';
            h += '• <strong>Causes:</strong> Anxiety, pain, fever, sepsis, mechanical ventilation too aggressive<br/>';
            h += '• <strong>CORRECTION NEEDED:</strong> Minute ventilation must DECREASE by ~' + mv_decrease + '%<br/>';
            h += '<br/><strong>IF SPONTANEOUSLY BREATHING:</strong><br/>';
            h += '• <strong>Address the driver:</strong> Reassurance, analgesia, antipyretics, treat sepsis<br/>';
            h += '• <strong>Expect gradual correction:</strong> As anxiety/pain/fever resolves, RR will decrease<br/>';
            h += '• Monitor: Recheck ABG after interventions; pCO2 should trend toward normal<br/>';
            h += '<br/><strong>IF MECHANICALLY VENTILATED:</strong><br/>';
            h += '• <strong>You MUST reduce minute ventilation</strong> (RR or tidal volume) by ~' + mv_decrease + '% toward pCO2 35–40<br/>';
            h += '• <strong>Timing:</strong> Adjust incrementally with each ABG (q1–2h); recheck 30 min after changes<br/>';
            h += '• Check: Sedation level, pain, PEEP setting</div></div>';
        }
    } else if (d.pCO2 > 55) {
        const mv_increase = Math.round(((d.pCO2 - 40) / 40) * 100);
        const is_compensatory_hypovent_trad = d.pH > 7.45;
        
        if (is_compensatory_hypovent_trad) {
            h += '<div class="driver-item">🟡 <strong>COMPENSATORY HYPOVENTILATION (pCO2 ' + d.pCO2.toFixed(0) + ' mmHg, pH ' + d.pH.toFixed(2) + ')</strong>';
            h += '<div class="correction"><strong>This is APPROPRIATE respiratory compensation for metabolic alkalaemia—DO NOT over-ventilate.</strong><br/>';
            h += '• <strong>EXPECTATION as alkalosis improves:</strong> Minute ventilation will naturally INCREASE as pH normalizes, but this happens passively<br/>';
            h += '<br/><strong>IF SPONTANEOUSLY BREATHING:</strong><br/>';
            h += '• <strong>Do NOT make any adjustments.</strong> The patient\'s respiratory drive will naturally increase as metabolic alkalosis is treated<br/>';
            h += '• <strong>Treat the cause:</strong> K replacement, address GI losses, volume repletion, stop diuretics<br/>';
            h += '• Monitor: Recheck ABG q1–2h; expect pCO2 to fall as pH corrects<br/>';
            h += '<br/><strong>IF MECHANICALLY VENTILATED:</strong><br/>';
            h += '• <strong>You MUST NOT over-ventilate.</strong> As alkalosis is treated, pCO2 will fall naturally<br/>';
            h += '• <strong>Increase minute ventilation only AFTER alkalosis is corrected and pCO2 remains elevated</strong><br/>';
            h += '• <strong>Rationale:</strong> Increasing RR/tidal volume now worsens alkalaemia</div></div>';
        } else {
            h += '<div class="driver-item">🔴 <strong>PRIMARY HYPOVENTILATION (pCO2 ' + d.pCO2.toFixed(0) + ' mmHg, pH ' + d.pH.toFixed(2) + ') – CREATING RESPIRATORY ACIDOSIS</strong>';
            h += '<div class="correction"><strong>This is INAPPROPRIATE hypoventilation—the PRIMARY pathology is inadequate ventilation.</strong><br/>';
            h += '• <strong>Causes:</strong> Respiratory depression, pain, weak respiratory muscles, mechanical issues<br/>';
            h += '• <strong>CORRECTION NEEDED:</strong> Minute ventilation must INCREASE by ~' + mv_increase + '%<br/>';
            h += '<br/><strong>IF SPONTANEOUSLY BREATHING:</strong><br/>';
            h += '• <strong>Address the driver:</strong> Reduce sedation/opioids, treat pain, assess respiratory muscles, treat respiratory disease<br/>';
            h += '• <strong>Encourage deep breathing:</strong> Prompt coughing, incentive spirometry<br/>';
            h += '• Monitor: Recheck ABG after interventions; pCO2 should trend toward normal<br/>';
            h += '<br/><strong>IF MECHANICALLY VENTILATED:</strong><br/>';
            h += '• <strong>You MUST increase minute ventilation</strong> (RR or tidal volume) by ~' + mv_increase + '% toward pCO2 35–45<br/>';
            h += '• <strong>Timing:</strong> Adjust incrementally with each ABG (q1–2h); recheck 30 min after changes<br/>';
            h += '• Check: Sedation, PEEP, compliance, circuit patency, ventilator synchrony, pain control</div></div>';
        }
    } else if (d.pCO2 > 45) {
        h += '<div class="driver-item">🟡 <strong>Mildly Elevated pCO2 (' + d.pCO2.toFixed(0) + ' mmHg)</strong>';
        h += '<div class="correction">• Mild hyperventilation may be permissive in some conditions<br/>';
        h += '• If persistent: Increase minute ventilation by 10-15%</div></div>';
    } else if (d.pCO2 < 35) {
        h += '<div class="driver-item">🟡 <strong>Mildly Low pCO2 (' + d.pCO2.toFixed(0) + ' mmHg)</strong>';
        h += '<div class="correction">• Usually compensatory for metabolic acidosis<br/>';
        h += '• If inappropriate: Reduce minute ventilation by 10-15%</div></div>';
    }
    
    if (Math.abs(d.pH - pred_pH) > 0.1) {
        h += '<div class="driver-item critical">⚠️ <strong>UNMEASURED IONS DETECTED (Δ pH = ' + (d.pH - pred_pH).toFixed(3) + ')</strong>';
        h += '<div class="correction">• Likely sources: Unmeasured cations (Ca, Mg) or anions (PO4, SO4)<br/>';
        h += '• Consider: Hypermagnesaemia, calciphylaxis, renal failure<br/>';
        h += '• Figge-Fencl correction may apply</div></div>';
    }
    
    h += '</div>';
    
    // SLIDERS
    h += '<div style="margin-top: 20px; padding: 12px; background: var(--bg-tertiary); border-radius: 6px; border-top: 2px solid var(--accent-normal);"><strong style="display: block; margin-bottom: 16px; color: var(--accent-normal);">INTERACTIVE: Adjust variables to see SID, Atot, predicted pH change</strong>';
    h += '<div class="slider-group"><div class="slider-label"><span>Na</span><span class="slider-label-value">' + d.Na.toFixed(0) + '</span></div><input type="range" id="na-slider" min="110" max="160" step="1" value="' + d.Na + '" data-param="Na"></div>';
    h += '<div class="slider-group"><div class="slider-label"><span>Cl</span><span class="slider-label-value">' + d.Cl.toFixed(0) + '</span></div><input type="range" id="cl-slider" min="80" max="120" step="1" value="' + d.Cl + '" data-param="Cl"></div>';
    h += '<div class="slider-group"><div class="slider-label"><span>Albumin</span><span class="slider-label-value">' + d.Albumin.toFixed(0) + ' g/L</span></div><input type="range" id="albumin-slider-stew" min="20" max="60" step="1" value="' + d.Albumin + '" data-param="Albumin"></div>';
    h += '<div class="slider-group"><div class="slider-label"><span>pCO2</span><span class="slider-label-value">' + d.pCO2.toFixed(0) + '</span></div><input type="range" id="pco2-slider" min="10" max="100" step="1" value="' + d.pCO2 + '" data-param="pCO2"></div>';
    h += '</div>';
    
    h += '</div>';
    return h;
}

function buildTraditional(d, AG, AGc, BE, acid) {
    let h = '<div class="analysis-section"><div class="section-title">Traditional Boston: GOLDMARK & USEDCARS</div>';
    h += '<div class="step-box"><strong>STEP 1: pH Status</strong> → pH = ' + d.pH.toFixed(2) + ' ' + (acid ? '🔴 ACIDAEMIA' : d.pH > 7.45 ? '🔵 ALKALAEMIA' : '🟢 NORMAL') + '</div>';
    h += '<div class="step-box"><strong>STEP 2: Winter\'s Formula (Expected pCO2 if acidaemia)</strong><br/>';
    if (acid) {
        const exp_pCO2 = 1.5 * d.HCO3 + 8;
        h += 'Expected = 1.5 × HCO3 + 8 ± 2 = ' + exp_pCO2.toFixed(0) + ' mmHg → Measured = ' + d.pCO2.toFixed(0) + ' mmHg<br/>';
        if (d.pCO2 < exp_pCO2 - 2) h += '🔵 Appropriate respiratory compensation';
        else if (d.pCO2 > exp_pCO2 + 2) h += '🔴 Concurrent respiratory acidosis';
        else h += '✓ Appropriate';
    }
    h += '</div>';
    h += '<div class="step-box"><strong>STEP 3: Anion Gap</strong><br/>AG = Na − (Cl + HCO3) = ' + AG.toFixed(0) + '<br/>Corrected (for Albumin ' + d.Albumin.toFixed(0) + ') = ' + AGc.toFixed(1) + ' → ' + (AGc > 16 ? '🔴 HIGH (HAGMA)' : '🟢 NORMAL') + '</div>';
    h += '<div class="step-box"><strong>STEP 4: Delta Ratio (if HAGMA)</strong><br/>';
    if (AGc > 16) {
        const delta = (AG - 12) / (24 - d.HCO3);
        h += 'Δ AG / Δ HCO3 = ' + delta.toFixed(2) + ' → ' + (delta > 2 ? '🔵 Concurrent metabolic alkalosis' : delta < 1 ? '🔴 Concurrent NAGMA' : '✓ Pure HAGMA');
    }
    h += '</div>';
    h += '<div class="step-box"><strong>STEP 5: Differential & Mnemonics</strong><br/>';
    if (acid) {
        if (AGc > 16) {
            h += '🔴 <strong>HIGH AG METABOLIC ACIDOSIS (HAGMA)</strong><br/><strong style="color: var(--accent-normal);">GOLDMARK:</strong><br/>• <strong>G</strong>lycols • <strong>O</strong>xoproline • <strong>L</strong>-lactate • <strong>D</strong>-lactate • <strong>M</strong>ethanol • <strong>A</strong>spirin • <strong>R</strong>enal failure • <strong>K</strong>etoacidosis';
        } else {
            h += '🔴 <strong>NORMAL AG METABOLIC ACIDOSIS (NAGMA)</strong><br/><strong style="color: var(--accent-normal);">USEDCARS:</strong><br/>• <strong>U</strong>reterosigmoidostomy • <strong>S</strong>aline • <strong>E</strong>ndocrine (Addison\'s) • <strong>D</strong>iarrhoea • <strong>C</strong>CA inhibitors • <strong>A</strong>mmonium chloride • <strong>R</strong>TA • <strong>S</strong>pironolactone';
        }
    }
    h += '</div>';
    
    h += '<div class="step-box"><strong>OSMOLAR GAP (if measured osmolality available)</strong><br/>';
    const calc_osm = (2 * d.Na) + d.Glucose + d.Urea;
    const osm_gap = d.Osmolality - calc_osm;
    h += 'Osmolar Gap = Measured (' + d.Osmolality.toFixed(0) + ') − Calculated (2×Na ' + (2*d.Na).toFixed(0) + ' + Glucose ' + d.Glucose.toFixed(1) + ' + Urea ' + d.Urea.toFixed(0) + ')<br/>';
    h += 'Osmolar Gap = ' + osm_gap.toFixed(0) + ' mOsm/kg<br/>';
    if (osm_gap > 10) {
        h += '🔴 <strong>ELEVATED (>10):</strong> Unmeasured osmoles present (toxic alcohols: methanol, ethylene glycol, isopropanol)<br/>';
    } else if (osm_gap > 5) {
        h += '🟡 <strong>BORDERLINE (5-10):</strong> Consider unmeasured osmoles, but could be normal variation';
    } else {
        h += '🟢 <strong>NORMAL (<5):</strong> Accounted osmoles only';
    }
    h += '</div></div>';
    return h;
}

function buildFigge(d, pred_pH) {
    let h = '<div class="analysis-section"><div class="section-title">Figge-Fencl: Unmeasured Ions Detection & Management</div>';
    
    // Calculate SID-based unmeasured ion burden
    const current_SID_figge = (d.Na + d.K + 2*d.iCa) - (d.Cl + d.Lactate);
    const target_pH_figge = 7.35;
    const current_Atot_figge = (d.Albumin/10) * (0.123 * d.pH - 0.631) + (d.PO4/10) * (0.309 * d.pH - 0.469);
    const required_SID_figge = 38 + ((target_pH_figge - 7.4 - 0.04*(current_Atot_figge-18) + 0.084*((d.pCO2-40)/7.5)) / 0.16);
    const unmeasured_ion_burden = required_SID_figge - current_SID_figge;
    
    h += '<div class="step-box"><strong>Predicted vs Measured pH</strong><br/>Predicted: ' + pred_pH.toFixed(2) + ' | Measured: ' + d.pH.toFixed(2) + ' | Δ: ' + (d.pH - pred_pH).toFixed(3) + '<br/>';
    
    if (Math.abs(d.pH - pred_pH) > 0.1) {
        h += '⚠️ <strong>UNMEASURED IONS PRESENT</strong><br/>';
        h += '<strong style="color: var(--accent-normal); display: block; margin-top: 8px;">Unmeasured Ion Burden:</strong><br/>';
        h += '• <strong>SID deficit accounted by unmeasured ions:</strong> ~' + Math.abs(unmeasured_ion_burden).toFixed(1) + ' mEq/L<br/>';
        h += '• ' + (unmeasured_ion_burden > 0 ? '🔴 <strong>Unmeasured ANIONS present</strong> (negative ions like PO4, SO4, organic acids)' : '🔵 <strong>Unmeasured CATIONS present</strong> (positive ions like Ca, Mg)') + '<br/>';
        h += '<strong style="color: var(--accent-normal); display: block; margin-top: 12px;">Investigation & Management:</strong><br/>';
        h += '• <strong>Measure:</strong> Serum calcium, magnesium, phosphate, sulfate<br/>';
        h += '• <strong>Consider causes:</strong> ' + (unmeasured_ion_burden > 0 ? 'High phosphate (renal failure), sulfate (renal failure), organic acidosis' : 'Hypermagnesaemia (laxatives, renal failure), hypercalcaemia, hyperparathyroidism') + '<br/>';
        h += '• <strong>Management:</strong> Address underlying cause while correcting measured SID/ventilation<br/>';
        h += '• <strong>Note:</strong> These unmeasured ions account for ~' + Math.abs(unmeasured_ion_burden).toFixed(1) + ' mEq of the pH discrepancy—correct them to fully resolve acidosis';
    } else {
        h += '✓ <strong>MEASURED IONS EXPLAIN pH</strong><br/>No significant unmeasured ion effect (Δ pH <0.1). Proceed with SID and ventilation management based on Hughes & Brain and Stewart analyses.';
    }
    h += '</div></div>';
    return h;
}
